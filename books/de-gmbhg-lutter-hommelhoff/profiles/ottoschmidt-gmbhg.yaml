id: ottoschmidt-gmbhg-v1
publisher: Otto Schmidt
jurisdiction: DE
language: de
# Файл — Druckdatei (GK21), а не книга: начало координат полосы смещено вверх.
# Колонтитул «Widerruf der Bestellung | § 38» стоит на top -93.8, тело —
# от -69.0 кеглем 9.25, аппарат сносок кеглем 8.25 с номером первым словом,
# подпись полосы «Kleindiek | 1025» на 416.4, а ниже — служебные строки набора
# («X:/OSV-2/GK-021/… – Seite 1025/1594», «GK21 - Druckdatei»). Номер Rn
# висит на ВНЕШНЕМ поле: справа на нечётной, слева на чётной, кегль 8.75.

units:
  - type: "Rn"
    id_prefix: "rn"
    mode: margin

margin:
  scope: page
  pad: 0.0

footnotes:
  mode: font_bottom
  bottom_band: 0.60
  note_size_max: 8.6

printed_page:
  # Обе доли подогнаны под смещённую полосу: сверху отсекается всё, включая
  # колонтитул, снизу окно узкое — между последней строкой аппарата (низ 408.5)
  # и подписью полосы (низ 425.2). Шире — и короткая сноска «45 Ebenso Bayer»
  # прочитается как колонцифра.
  band: [-0.16, 0.30]
  max_chars: 40
  patterns:
    - '^(\d{1,4})\s*\|'
    - '\|\s*(\d{1,4})$'

junk:
  header_band: -0.12
  patterns:
    - '^X:/OSV'
    - '^GK\d+ - Druckdatei'
    - '\.\s\.\s\.\s\.'

address:
  section:
    # Заголовок параграфа идёт кеглем 13.0 при теле 9.25.
    mode: pattern
    pattern: '^§\s?(\d+[a-zä]?)\s+[A-ZÄÖÜ]'
    min_size: 11.0
    anchor: start

citation:
  template: "{cite_prefix} {address}"
