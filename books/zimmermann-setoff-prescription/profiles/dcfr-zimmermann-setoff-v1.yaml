id: dcfr-zimmermann-setoff-v1
publisher: Oxford University Press
jurisdiction: DCFR
language: en
# Reinhard Zimmermann, Comparative Foundations of a European Law of Set-Off
# and Prescription (2002). 196 полос, цифровой PDF, одна колонка.
#
# Кегли: 10.7 тело, 8.0 сноски, 7.5 знак сноски в тексте, 6.0 номер сноски
# в аппарате, 11.0 заголовок раздела, 10.0 колонтитул и КОЛОНЦИФРА.
#
# Пробельных глифов в текстовом слое нет: «Therequirementsforset-off»
# сплошняком. Слова восстанавливает _space_gap по зазорам.
#
# Нумерованных абзацев в книге нет, поэтому единица — ПОЛОСА, а адрес —
# номер печатной страницы.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  # Аппарат внизу своей полосы, кегль 8.0 против 10.7 у тела. Полоса взята
  # с запасом: замерено, блок начинается на 425 из 842, то есть на 0.50.
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.45

printed_page:
  # Колонцифра стоит НЕ у нижнего края полосы, а НАД блоком сносок — на
  # 660 из 842. Стандартная проверка её поэтому не находила (в паспорте
  # файла «читается на 0% страниц»). Верхняя полоса отключена: наверху
  # колонтитул с названием раздела, номера там нет.
  band: [0.0, 0.22]

junk:
  # Колонтитул с названием раздела снимается ПОСЛЕ чтения колонцифры:
  # 183 из 842 — это 0.217, полоса взята чуть шире.
  header_band: 0.24
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
