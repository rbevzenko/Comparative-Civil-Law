id: dcfr-sellier-fulledition-v1
publisher: Sellier European Law Publishers
jurisdiction: DCFR
language: en
# Draft Common Frame of Reference, Full Edition (2009), тома с текстом,
# комментариями и национальными заметками. Цифровой PDF, одна колонка,
# кегль тела 12.0, служебные заголовки COMMENTS и NOTES — 14.0.
# Колонтитула нет, внизу полосы голая колонцифра.
#
# ЕДИНИЦА — СТАТЬЯ. Так DCFR и цитируют: «DCFR II.–8:103», и никакой
# другой единицы традиция не знает. Номер составной: книга римской цифрой,
# часть буквой (не у всех книг), дальше «глава:статья».
#
# Двоеточие после номера обязательно, и это не косметика. Колонтитул
# несёт тот же номер («IV.B.– 5:101 Book IV»), но БЕЗ двоеточия и без
# заголовка. Без этого требования каждая полоса открывала бы ложную
# статью, а настоящая теряла бы начало.
#
# Пробелы внутри номера гуляют по вёрстке: в заголовке «IV. B. – 4:102»,
# в колонтитуле «IV.B.– 5:101». Поэтому \s* между всеми частями.

# АДРЕС СОСТАВНОЙ, и это не украшение. Номер статьи DCFR — «II.–8:103» —
# не число, а пайплайн приводит номер единицы к целому. Первый прогон это
# и показал: «I.–1:101» стало 101, и 1977 карточек сели на 110 ключей,
# потому что статья 101 есть в каждой главе. Поэтому книга с главой
# («II.–8») уходит в РАЗДЕЛ, а единицей остаётся номер статьи внутри главы.
# Это ровно та же машинка, что даёт «§ 812 Rz 45» у австрийцев.
#
# Буквенная часть («IV.A.–6:104») необязательна и есть только у книги IV,
# где главы разбиты на части. Без неё в паттерне пропадает вся книга IV:
# первый прогон дал 566 статей вместо 874, а на месте пропавшего куска
# выросла карточка на пять миллионов знаков — текст до следующего
# распознанного заголовка.
#
# Форма раздела в этом томе единая: 874 заголовка из 874 набраны без
# пробелов («II.–8:103»). Пробелы гуляют в КРАТКОМ издании («IV. B. – 4:102»),
# и если дойдёт до него, понадобится свой профиль, а не правка этого.

units:
  - type: "Art."
    id_prefix: "art"
    mode: flow
    pattern: '^[IVX]+\.(?:[A-Z]\.)?[–—-]\d+:(\d+):\s'
    address_template: "{section}:{number}"

address:
  section:
    mode: pattern
    pattern: '^([IVX]+\.(?:[A-Z]\.)?[–—-]\d+):\d+:\s'
    anchor: start
  template: "{section}:{number}"

footnotes:
  # Сносок в подвале полосы нет: весь аппарат вынесен в блок NOTES
  # внутри статьи и набран тем же кеглем, что и тело. Отделять его от
  # текста по кеглю нельзя, и он остаётся в карточке статьи — что
  # правильно: национальные заметки цитируют вместе со статьёй.
  mode: none

printed_page:
  # Колонцифра — голое число внизу полосы (top 0.921). Колонтитул вверху
  # (top 0.049) цифр страницы не несёт, но несёт номер статьи, поэтому
  # паттерн требует, чтобы в строке НЕ БЫЛО ничего, кроме числа.
  band: [0.04, 0.10]
  patterns:
    - '^(\d{1,4})$'

junk:
  # Колонтитула в этом издании нет — снимать нечего.
  patterns: []

statutory:
  patterns:
    - '\b[IVX]+\.\s*(?:[A-Z]\.\s*)?[–—-]\s*\d+:\d+\b'

cross_refs:
  patterns:
    - '\bBook\s+[IVX]+\b'
    - '\bChapter\s+\d+\b'

citation:
  template: "{authors}, {title}, {publisher}, {year}, {address}"
