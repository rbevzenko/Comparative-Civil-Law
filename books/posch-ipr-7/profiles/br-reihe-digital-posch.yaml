id: br-reihe-digital-posch-v1
publisher: Springer Wien New York
jurisdiction: AT
language: de
# Серия «Bürgerliches Recht» (Lehrbuchreihe), издательский файл.
# Собран по Posch, Bürgerliches Recht VII: Internationales Privatrecht,
# 5. Aufl. 2010.
#
# Родня `br-reihe-digital-v1` (том V, Kerschner): та же серия, то же
# издательство, тот же год, та же полоса 439×666, тот же кегль тела 10.5 и
# те же кегли сносок 8.5/8.0, та же составная единица «19/25» = § 19 Rz 25
# на внешнем поле. Отдельный профиль нужен ровно из-за двух чисел.
#
# Первое: параграфов здесь 19, а не 6, и паттерн у тома V («^[1-6]/») в этой
# книге отрезал бы три четверти карточек.
#
# Второе и важное: аппарат у этого тома тяжёлый. У тома V блок сносок
# начинается не выше 0.76 высоты, здесь — на 106 полосах из 232 выше 0.74, а
# самый высокий на 0.459 (f140, сноска 21 к Verordnung 509/2006). Полоса
# 0.75 оставила бы в теле 892 строки сносок. Замерено по всем 239 полосам
# тела: непрерывный мелкий хвост полосы начинается минимум на 0.457, поэтому
# полоса взята 0.45.
#
# Цена этого решения одна и известна: на f244 (Rz 19/5) мелким кеглем набран
# не аппарат, а врезка «ÜBERSICHT» с планом CISG, и она уйдёт в сноски.
# Единственная такая врезка в книге; проверить карточку 19/5 после нарезки.
#
# В файле нет пробелов: слова разделены только позицией — не проверять текст
# через pdfplumber.extract_text() со значениями по умолчанию.

units:
  - type: "Rz"
    id_prefix: "rz"
    mode: flow
    # Неразрывный пробел ставит scripts/normalize_margin_numbers.py и только
    # для номеров, снятых с поля: без метки паттерн ловит перенос
    # перекрёстной ссылки («15/28ff und…»), а не начало единицы.
    # U+00A0 в слое книги не встречается ни разу (проверено по телу).
    pattern: '^(?:1[0-9]|[1-9])/(\d{1,3}) \s*'
    address_template: "Rz {section}/{number}"

address:
  section:
    mode: pattern
    pattern: '^(1[0-9]|[1-9])/\d{1,3} '
    anchor: start
  template: "Rz {section}/{number}"

footnotes:
  mode: font_bottom
  note_size_max: 9.0
  bottom_band: 0.45

printed_page:
  # Колонцифра стоит отдельной строкой на высоте 0.912 — как у тома V.
  band: 0.10

junk:
  # Колонтитул стоит на 0.060 высоты, а НИЖНИЙ его край — на 0.0759:
  # полоса 0.075 не достаёт до него на треть пункта, и строка
  # «Statutenwechsel § 8» садится в середину карточки как текст книги.
  header_band: 0.08    # колонтитул «§ 15 Schuldverhältnisse»
  footer_band: 0.93    # снимается ПОСЛЕ чтения колонцифры
  patterns: []

statutory:
  patterns:
    - '§+\s*\d+[a-z]?\s*(?:Abs\s*\d+\s*)?(?:ABGB|IPRG|EheG|EPG|AußStrG|KSchG|UGB|EO|JN|IO|UrhG|UWG)'
    - 'Art\s*\d+[a-z]?\s*(?:Abs\s*\d+\s*)?(?:CISG|EuGVVO|EVÜ|EGBGB|Rom\s?I-VO|Rom\s?II-VO|AEUV|EGV)'
    - '§§\s*\d+[a-z]?\s*(?:ff|f)?'

cross_refs:
  patterns:
    - '(?:oben|unten|siehe|vgl|dazu|s)\s+Rz\s?\d{1,2}/\d{1,3}(?:\s*(?:ff|f)\.?)?'

citation:
  template: "{cite_as} {address}"
