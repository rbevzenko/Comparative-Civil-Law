id: oup-burrows-restatement-v1
publisher: Oxford University Press
jurisdiction: EN
language: en
# Andrew Burrows, A Restatement of the English Law of Contract, OUP 2016.
# Издательский PDF, 309 страниц.
#
# Книга состоит из двух частей: сам Restatement (f16–f54) и комментарий к
# нему (f58–f275). Комментарий ПОВТОРЯЕТ текст каждой секции целиком и
# разбирает её, поэтому в корпус берётся только он: иначе каждая норма
# попадёт в корпус дважды, с одним и тем же адресом.
#
# Кегли: тело 10.0, ссылка-заголовок и колонтитул 10.5, колонцифра 10.5
# внизу по центру. Сносок в книге нет — ссылки на дела идут в тексте.
#
# Единица цитирования — ссылка на секцию Restatement, стоящая отдельной
# строкой перед своим куском комментария: «3(1)», «7(3)–(4)», «16(3)(a)»,
# «21(1)(a), (2), and (3)». Так книга и цитируется.
#
# Номер тут не число, а строка («7(3)–(4)»), поэтому режим heading: он
# нумерует единицы подряд, а сам адрес берётся из address.section, куда
# ссылка попадает целиком. Порог кегля 10.4–10.6 отделяет ссылку от тела.
#
# Второе семейство — заголовок секции («7 Agreement») кеглем тела. Без него
# текст самой нормы, воспроизведённый в комментарии перед разбором, уезжает
# в конец карточки ПРЕДЫДУЩЕЙ секции. У секций без подпунктов заголовок
# оказывается единственной единицей, и весь комментарий ложится в него.
#
# Отличить заголовок секции от перенесённой на начало строки ссылки на дело
# («2 Ch D 463, CA.», «4 All ER 907, at [37]») позволяет отсутствие цифр в
# остатке строки: в названиях всех пятидесяти секций цифр нет.

units:
  - type: "s"
    id_prefix: "sec"
    mode: heading
    pattern: '^\d{1,2}\s+[A-Z][a-z][^\d]{0,85}$'
    size_min: 9.9
    size_max: 10.1
    address_template: "s {section}"
  - type: "s"
    id_prefix: "s"
    mode: heading
    pattern: '^\d{1,2}(?:\([0-9a-z]{1,3}\))+(?:\s*[–-]\s*\([0-9a-z]{1,3}\))?(?:,\s*\([0-9a-z]{1,3}\)(?:\s*[–-]\s*\([0-9a-z]{1,3}\))?)*(?:,?\s+and\s+\([0-9a-z]{1,3}\))?$'
    size_min: 10.4
    size_max: 10.6
    address_template: "s {section}"

address:
  template: "s {section}"
  section:
    mode: pattern
    # Ссылка захватывается ЦЕЛИКОМ: она и есть адрес. Второй вариант —
    # заголовок секции, где адресом служит один её номер.
    pattern: '^(\d{1,2}(?:\([0-9a-z]{1,3}\))*(?:\s*[–-]\s*\([0-9a-z]{1,3}\))?(?:,\s*\([0-9a-z]{1,3}\)(?:\s*[–-]\s*\([0-9a-z]{1,3}\))?)*(?:,?\s+and\s+\([0-9a-z]{1,3}\))?)(?:$|\s+[A-Z][a-z][^\d]{0,85}$)'

footnotes:
  mode: none

printed_page:
  # Колонтитул стоит на 0.062 высоты и набран тем же кеглем, что колонцифра,
  # поэтому верхняя полоса выключена.
  band: [0.0, 0.09]

junk:
  header_band: 0.085
  footer_band: 0.90
  patterns:
    - '^OUP CORRECTED PROOF'

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\bs\s?\d{1,2}(?:\(\d{1,2}\))?\b'

citation:
  template: "{cite_as} {address}"
