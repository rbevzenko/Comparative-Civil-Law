id: hart-law-masters-v1
publisher: Hart Publishing
jurisdiction: UK
language: en
# Ewan McKendrick, Contract Law (Hart Law Masters). Издательский PDF,
# 498 страниц. Кегль тела 9.5, выключных цитат 8.5, заголовка раздела 12,
# подраздела 11, вопросов для самопроверки 9.
#
# Единица цитирования — нумерованный раздел, и так книга и цитируется:
# § 4.6, § 4.6.1. Уровней два, и оба берутся одним семейством: номер
# единицы — последняя составляющая, раздел — всё, что перед ней. Тогда
# «2.4» даёт раздел 2 номер 4, а «2.4.1» — раздел 2.4 номер 1.
#
# Порог кегля обязателен: тем же «N.N» открываются вопросы для самопроверки
# в конце главы («2.1 Do you think that Centrovincial Estates plc…»),
# набранные кеглем 9. Без порога они становятся единицами и дублируют
# настоящие разделы.
#
# Сносок в книге нет: ссылки на литературу даны в тексте по-гарвардски
# («(Wightman, 1989)»).

units:
  - type: "§"
    id_prefix: "sec"
    mode: flow
    # Заглядывание вперёд, а не захват: extract отрезает текст карточки по
    # концу совпадения, и захваченный первый знак заголовка пропал бы
    # («ntroduction» вместо «Introduction»).
    pattern: '^(?:\d{1,2}\.)+(\d{1,3})(?=\s+\S)'
    size_min: 10.5
    address_template: "§ {section}.{number}"

address:
  template: "§ {section}.{number}"
  section:
    mode: pattern
    pattern: '^((?:\d{1,2}\.)*\d{1,2})\.\d{1,3}(?=\s+\S)'

footnotes:
  mode: none

printed_page:
  # Колонцифра сидит в колонтитуле и меняет сторону: «2 Contract Law» на
  # чётной полосе, название раздела и номер на нечётной.
  band: 0.1
  patterns:
    - '^(\d{1,4})\s'
    - '\s(\d{1,4})$'

junk:
  header_band: 0.09

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\b\d{1,2}\.\d{1,2}(?:\.\d{1,2})?\b'

citation:
  template: "{cite_as} {address}"
