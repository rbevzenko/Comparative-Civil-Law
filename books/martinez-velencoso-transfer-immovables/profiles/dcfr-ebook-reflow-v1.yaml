id: dcfr-ebook-reflow-v1
publisher: Cambridge University Press
jurisdiction: Comparative law
language: en
# María Luisa Martínez Velencoso, Sergio Bailey, Andrea Pradi (eds), Transfer of Immovables in European Private Law (Common Core), 836 полос.
#
# ПЕРЕВЁРСТАННАЯ ЭЛЕКТРОННАЯ КНИГА. Признак один и решает всё: в файле
# ровно ОДИН кегль текста и ни колонтитулов, ни колонцифр. Ни номера
# печатной страницы, ни отдельного аппарата сносок взять неоткуда.
#
# Отсюда два следствия:
#   * единица — ПОЛОСА, а адрес строится от главы («ch. 4-7» — седьмой
#     фрагмент четвёртой главы): место находится по оглавлению;
#   * аппарат НЕ отделяется — отличить его от тела нечем, и сноски
#     остаются в тексте полосы, где и ищутся вместе с ней.

units:
  # Единица названа «frg.», а не «p.», НАМЕРЕННО. Номер здесь — это номер
  # полосы ФАЙЛА, а не печатной страницы: печатной пагинации у книги нет
  # вовсе. Назвать его «p.» значило бы выдать одно за другое, и читатель
  # сослался бы на страницу, которой в книге нет.
  - type: "frg."
    id_prefix: "frg"
    mode: page

address:
  template: "frg. {number}"

footnotes:
  mode: none

printed_page:
  band: 0.0

junk:
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
