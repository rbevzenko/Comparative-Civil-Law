id: dcfr-vicente-obligations-v1
publisher: Edward Elgar
jurisdiction: Comparative literature
language: en
# Dário Moura Vicente, Comparative Law of Obligations. 494 полосы,
# цифровой PDF, одна колонка.
#
# Кегли: 10.0 тело, 9.0 сноски, 8.0 колонтитул с колонцифрой, 5.8 знак
# сноски в тексте, 5.2 НОМЕР сноски в аппарате, 12.0 и 18.0 заголовки.
#
# Колонтитул: на нечётной «Contracts 23», на чётной «24 Comparative law of
# obligations» — номер меняет сторону, поэтому шаблона два.
#
# Нумерованных абзацев нет; единица — ПОЛОСА, адрес — печатная страница.
#
# Номер сноски стоит ОТДЕЛЬНОЙ строкой кеглем 5.2, а её текст — следующими
# строками кеглем 9.0. Штатный разбор ищет «номер, пробел, текст» в одной
# строке и такого аппарата не видит вовсе: выходило 32 сноски при 455
# полосах с аппаратом. Нужен `rebuild_notes.py --marker-line`: с ним 2249.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  # Кегль сносок 9.0 против 10.0 у тела: разница в один пункт, но выдержана.
  # Порог по умолчанию (медиана минус 1.5) их бы не взял, поэтому задан явно.
  mode: font_bottom
  note_size_max: 9.5
  bottom_band: 0.45

printed_page:
  # Колонтитул на 68 из 734 — это 0.093, полоса взята чуть шире.
  band: [0.10, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '\D\s+(\d{1,4})$'

junk:
  header_band: 0.11
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
