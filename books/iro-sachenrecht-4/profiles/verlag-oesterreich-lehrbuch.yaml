id: verlag-oesterreich-lehrbuch-v1
publisher: Verlag Österreich
jurisdiction: AT
language: de
# Iro, Bürgerliches Recht IV: Sachenrecht, 6. Aufl., Verlag Österreich 2016.
# Скан большого разрешения: страница 1777x2659 pt, кегль тела ~43, поэтому
# все пороги кеглей здесь втрое выше обычных. Слой OCR чужой, но чистый.
#
# Единица цитирования у этой линейки СОСТАВНАЯ и печатается слитно: «1/13»
# читается «§ 1, Rz 13», и книга сама так на себя ссылается («vgl Rz 2/29»),
# и её оглавление устроено так же (колонка «Rz» со значениями вида «2/26»).
# Поэтому номер параграфа берётся не из заголовка и не из колонтитула, а из
# той же строки, что и номер единицы: он там стоит всегда.

# Номер висит на ВНЕШНЕМ поле и меняет сторону на развороте, но режим margin
# его не берёт: там номер обязан быть голым числом. Поэтому перед extract.py
# книга проходит через normalize_margin_numbers.py — он снимает номер с поля
# и приписывает к началу своей строки, после чего работает обычный flow.

units:
  - type: "Rz"
    id_prefix: "rz"
    mode: flow
    # Группа одна и это ВТОРАЯ половина адреса: первая уходит в раздел.
    # Опора справа не нужна — сам вид «число/число» в начале строки уже
    # достаточно редок, а голое число здесь единицы не открывает.
    # Номер параграфа ограничен книгой (§§ 1-17): иначе «266/12» из
    # цитаты в тексте заводит в корпус несуществующий раздел.
    # Неразрывный пробел после номера ставит normalize_margin_numbers.py и
    # только для номеров, снятых с поля. Без этой метки паттерн ловит и
    # перенос перекрёстной ссылки: строка «5/79 ff). Weiters …» — это
    # продолжение «(vgl Rz 5/79 ff)», а не начало единицы.
    pattern: '^(?:1[0-7]|[1-9])/(\d{1,3})\u00a0\s*'
    address_template: "Rz {section}/{number}"

address:
  section:
    mode: pattern
    pattern: '^(1[0-7]|[1-9])/\d{1,3}\u00a0'
    anchor: start
  template: "Rz {section}/{number}"

footnotes:
  # Кегли: тело 43, сноски 34.5, мелкий кегль тела (примеры) 35.0 — между
  # сносками и примерами всего полпункта, разделить их одним кеглем нельзя.
  # Поэтому вторым условием положение: сноски начинаются в среднем на 0.89
  # высоты полосы, мелкий абзац тела кончается в среднем на 0.72.
  mode: font_bottom
  note_size_max: 38.0
  bottom_band: 0.80

printed_page:
  band: 0.08           # колонцифра стоит ВНИЗУ полосы, одна на строке

junk:
  header_band: 0.07    # колонтитул «§1 Grundbegriffe und Grundsätze»
  footer_band: 0.92    # снимается ПОСЛЕ чтения колонцифры
  patterns:
    - '^[•·]+$'        # артефакт скана: маркер сноски рвётся на цифру и точку

statutory:
  patterns:
    - '§+\s*\d+[a-z]?\s*(?:Abs\s*\d+\s*)?(?:ABGB|GBG|WEG|BauRG|MRG|EO|KSchG|UGB|IO|MinroG|PatG|MuSchG|ZPO|AußStrG|WRG|ForstG)'
    - '§§\s*\d+[a-z]?\s*(?:ff|f)?'

cross_refs:
  patterns:
    - '(?:oben|unten|siehe|vgl|dazu|s)\s+Rz\s*\d{1,3}/\d{1,3}(?:\s*(?:ff|f)\.?)?'

citation:
  template: "{cite_as} {address}"
