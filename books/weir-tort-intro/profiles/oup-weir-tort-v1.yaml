id: oup-weir-tort-v1
publisher: Oxford University Press
jurisdiction: UK
language: en
# Tony Weir, An Introduction to Tort Law, 2nd ed. (Clarendon Law Series).
# Скан с текстовым слоем OCR, 132 листа, тело f16–f128.
#
# На ОДНОМ листе файла сняты ДВЕ страницы книги (разворот). Обычная сборка
# строк идёт через весь лист и склеивает строку левой страницы со строкой
# правой: «…Is the defendant to be distin». Поэтому лист делится пополам
# через scripts/pages_spread.py --split 421, и каждая половина разбирается
# как отдельная полоса: своя колонцифра, свой колонтитул.
#
# СВОЕЙ ЕДИНИЦЫ ЦИТИРОВАНИЯ У КНИГИ НЕТ: абзацы не нумерованы. Единица —
# типографская страница, ею книга и цитируется.
#
# Аппарат сносок не отделяется: знак сноски в OCR-слое не читается, а без
# номера сноска не грузится. Пусть остаётся внизу своей карточки.

units:
  - type: "p."
    id_prefix: "p"
    mode: page
    address_template: "p. {number}"

address:
  template: "p. {number}"

footnotes:
  mode: none

printed_page:
  # Колонцифра в колонтитуле: «2 An Introduction to Tort» на чётной,
  # «Introduction 15» на нечётной. Нижняя полоса выключена.
  band: [0.105, 0.0]
  patterns:
    - '^(\d{1,4})\s'
    - '\s(\d{1,4})$'

junk:
  header_band: 0.105

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns: []

citation:
  template: "{cite_as} {address}"
