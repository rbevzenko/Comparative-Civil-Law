id: sweetmaxwell-davies-company-v1
publisher: Sweet & Maxwell
jurisdiction: EN
language: en
# Gower, Principles of Modern Company Law, 11th ed. (Davies/Worthington/Hare).
# Выгрузка ProView, 2134 страницы, тело f393–f2026, дальше указатель.
#
# Кегли: тело 14.4, сноски и указатель 10.8, заголовок раздела 16.6.
#
# Типографской пагинации в файле НЕТ вовсе — ни колонтитула, ни колонцифры.
# Адресом служит номер абзаца, он же единица цитирования: «10–087». Полоса
# читается от края до края, поэтому ни header_band, ни footer_band не нужны.
#
# Сносок внизу полосы нет: они собраны в конец каждой главы и занимают там
# целые полосы кеглем 10.8. Их переносит в аппарат
# scripts/endnotes_to_notes.py, а раскладывает по карточкам знаком в тексте
# scripts/attach_notes_by_marker.py.
#
# Слова в тексте разделены табуляцией нулевой ширины — до extract.py нужен
# scripts/detab_lines.py.
#
# Номер абзаца стоит в начале строки, но у «6–008» текст начинается со
# следующей строки, и номер оказывается один на строке. Прощать это нельзя:
# в оглавлении главы номер тоже стоит один на строке, у правого поля, и
# лишняя единица даёт ДУБЛЬ адреса — а дубль хуже пропуска. Абзац 6–008
# поэтому прирастает к 6–007; это единственный такой случай на книгу.

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    pattern: '^\d{1,2}[–-](\d{3})(?=\s+[A-Z“‘"(\[])'
    size_min: 14.0
    size_max: 14.8
    address_template: "{section}–{number}"

address:
  template: "{section}–{number}"
  section:
    mode: pattern
    pattern: '^(\d{1,2})[–-]\d{3}(?=\s+[A-Z“‘"(\[])'

footnotes:
  mode: none

printed_page:
  # Колонцифры в файле нет. Полоса 0.0 выключает поиск целиком: иначе в
  # адрес приезжает первое попавшееся число из текста.
  band: 0.0

junk:
  patterns:
    # Оглавление главы на её первой полосе: «The board and litigation 15–002».
    # Без этого оно целиком уезжает в текст последней карточки предыдущей
    # главы, а стоящий там же отдельной строкой номер «15–007» становится
    # второй единицей с тем же адресом.
    - '\s\d{1,2}[–-]\d{3}$' 

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\.?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\b\d{1,2}[–-]\d{3}\b'

citation:
  template: "{cite_as} {address}"
