id: manz-koziol-grundriss-scan-v1
publisher: MANZ
jurisdiction: AT
language: de
# Koziol – Welser/Kletečka, Grundriss des bürgerlichen Rechts I, 14. Aufl.,
# MANZ 2014 — СКАН (709 страниц файла, растр на всю полосу с чужим слоем OCR),
# sha256 2b8d4113…
#
# Почему не manz-koziol-grundriss-v1, хотя книга та же самая: тот профиль
# собран по ЦИФРОВОМУ файлу этой книги, и у него поля разворота считаются по
# чётности страницы файла в другую сторону. Здесь препринт занимает 35 страниц
# (типографская 1 = страница файла 36), чётность переворачивается, и старый
# профиль снял бы номера не с той стороны. Правка v1 задним числом сломала бы
# уже нарезанные по нему карточки, поэтому заведён отдельный профиль линейки.

units:
  - type: "Rz"
    id_prefix: "rz"
    mode: margin
    address_template: "Rz {number}"

margin:
  side: inner          # физически это ВНЕШНЕЕ поле; «inner» здесь означает
                       # «нечётная страница файла — поле слева, чётная — справа».
                       # Смещение печатной пагинации постоянно на всём теле
                       # (printed = file − 35, сверено на f37/f40/f691), поэтому
                       # чётность файла — надёжный признак стороны разворота.
  parity: pdf          # НЕ printed: на скане колонцифра читается лишь на части
                       # страниц (паспорт: 78%), и при промахе сторона поля
                       # перевернулась бы. Чётность страницы файла известна всегда.
  scope: page          # полоса набора на скане гуляет от страницы к странице
  pad: 2.0

address:
  section:
    mode: none         # Rz сквозные по тому (1 … ~1845), составного адреса нет

footnotes:
  # Кегль здесь работает — вопреки обычному для скана — потому что чужой слой
  # OCR держит два чистых кластера, замеренных по всем 623 страницам тела:
  # основной текст 14.0-14.7 pt (минимум 13.5), мелкий кегль 11.4-13.3 pt
  # (максимум 13.3). Граница 13.4 не задевает ни один из них.
  #
  # НО: мелким кеглем набраны и сноски, И примеры/литература внутри тела
  # («Beispiel», списки Literatur перед разделом). Кегль их не различает,
  # поэтому вторым условием стоит положение: нижние 35% полосы. Примеры стоят
  # выше, сноски — ниже. Проверено на f202, f203, f364: при 0.60 в сноски
  # уезжает мелкий абзац тела, при 0.70 в тело протекает начало блока сносок.
  #
  # Режим годится только для ветки A: split_footnotes при method=ocr кегль
  # игнорирует. Если книга пойдёт веткой B, здесь нужен position_bottom.
  mode: font_bottom
  note_size_max: 13.4
  bottom_band: 0.65

printed_page:
  band: 0.06
  patterns:
    - '^(\d{1,4})\s+\S'    # verso: колонцифра слева в колонтитуле
    - '\s(\d{1,4})$'       # recto: справа

junk:
  header_band: 0.045       # колонтитул снимается ПОСЛЕ чтения колонцифры
  footer_band: 0.945
  patterns:
    - '^\)+$'              # скан рвёт надстрочный знак сноски «1)» на «1» и «)»,
                           # и скобка остаётся отдельной строкой (паспорт: 196
                           # страниц выборки из 40 — самый частый мусор)

statutory:
  patterns:
    - '§+\s*\d+[a-z]?\s*(?:Abs\s*\d+\s*)?(?:ABGB|EO|KSchG|UGB|GBG|EheG|UrhG|WEG|MRG|IO|GmbHG|AktG|VersVG|EKHG|PHG|UbG|SPG|EPG|AußStrG|ZPO|JN)'
    - '§§\s*\d+[a-z]?\s*(?:ff|f)?'

cross_refs:
  patterns:
    - '(?:oben|unten|siehe|vgl|dazu)\s+Rz\s*\d+(?:\s*(?:ff|f)\.?)?'

citation:
  template: "{cite_as} {address}"
