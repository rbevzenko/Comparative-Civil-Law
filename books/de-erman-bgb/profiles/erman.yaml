id: erman-bgb-17-v1
publisher: Otto Schmidt
jurisdiction: DE
language: de
# Erman, BGB. Handkommentar, 17. Auflage 2023. Файл — типографские
# печатные данные (WMTP GmbH), 7824 полосы. Полоса тела 106–489 кеглем 8.5,
# номер Randnummer на ВНЕШНЕМ поле (x0 ≈ 497 справа, ≈ 94 слева), в самом низу
# «Armbrüster 543» на нечётной и «544 Armbrüster» на чётной — комментатор и
# колонцифра. Сносок нет: Erman даёт ссылки прямо в тексте.

units:
  - type: "Rn"
    id_prefix: "rn"
    mode: margin

margin:
  scope: page
  pad: 0.0

footnotes:
  mode: none

printed_page:
  # Колонцифра в самом низу рядом с фамилией. Верхнюю полосу не смотрим вовсе:
  # там типографская служебка с номером ПЕЧАТНОГО ЛИСТА («S. 54») и счётчиком
  # «543 von 780» — оба выдали бы себя за колонцифру.
  band: [0.0, 0.11]
  max_chars: 40
  patterns:
    - '^[A-ZÄÖÜ][A-Za-zÄÖÜäöüß/.\- ]{2,30}\s(\d{1,4})$'
    - '^(\d{1,4})\s[A-ZÄÖÜ][A-Za-zÄÖÜäöüß/.\- ]{2,30}$'

junk:
  # Полоса 0.17 снимает разом типографскую служебку (0.016 и 0.029 высоты) и
  # колонтитул (0.158). Тело начинается с 0.185.
  header_band: 0.17
  footer_band: 0.88
  patterns:
    - '^WMTP GmbH gedruckt'
    - '^Werk: ERMAN'

address:
  section:
    # Заголовок параграфа стоит в теле («§ 163 Zeitbestimmung», кегль 10.2
    # против 8.5) и он и есть точка переключения: у Ermanа на одной полосе
    # умещается по два-три параграфа, и колонтитула для этого мало.
    # Условия «заглавная, потом строчная» мало: ссылка внутри текста
    # («§ 823 Rn 35. Gleiches gelte …», «§ 189 StGB bspw ist …») тоже начинает
    # строку и тоже ему отвечает. На первых двух тысячах полос образец
    # срабатывал 825 раз, а настоящих заголовков среди них было 473 — остальные
    # 352 переключения рвали ряд Rn и роняли непрерывность до 0.72.
    # Отличает заголовок кегль: 10.2 против 8.5 у тела.
    mode: pattern
    pattern: '^§\s?(\d+[a-zä]?)\s+[A-ZÄÖÜ]'
    min_size: 9.5
    anchor: start

citation:
  # Комментатор подставляется позже section_from_page_head.py: в meta.json
  # его нет и быть не может — он свой у каждого параграфа.
  template: "Erman, BGB, 17. Aufl. 2023, {address}"
