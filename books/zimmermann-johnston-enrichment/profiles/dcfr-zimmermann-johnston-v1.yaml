id: dcfr-zimmermann-johnston-v1
publisher: Cambridge University Press
jurisdiction: DCFR
language: en
# David Johnston & Reinhard Zimmermann (eds), Unjustified Enrichment: Key
# Issues in Comparative Perspective (2002). 793 полосы, цифровой PDF.
#
# ФАЙЛ — ТИПОГРАФСКАЯ КОРРЕКТУРА. Вверху каждой полосы служебная плашка
# наборщика в две строки: «P1:FYX/FYX P2:FYX/UKS QC:FYX/UKS T1:FYX» и
# «CU074-Johnston CU074-06 January16,2002 16:2 CharCount=0». Она набрана
# кеглем 8.0 — тем же, что и сноски, — и отличается только положением
# (35–48 из 792). Снимается колонтитульной полосой.
#
# Кегли: 9.7 тело, 8.0 сноски И плашка, 10.0 колонтитул с колонцифрой,
# 6.8 знак сноски в тексте, 6.0 номер сноски в аппарате.
#
# Единица — ПОЛОСА, адрес — печатная страница из колонтитула.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  # Полоса аппарата начинается с 0.20, а не с нуля: иначе служебная плашка
  # наборщика (кегль 8.0, top 35–48, то есть 0.06) уехала бы в сноски.
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.20

printed_page:
  # Колонтитул на 106 из 792 — это 0.134, полоса взята шире. Плашка
  # наборщика стоит выше и под шаблоны не подходит: первая строка кончается
  # на «T1:FYX», вторая — на «CharCount=0» без пробела перед цифрой.
  band: [0.15, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    # Перед номером требуется БУКВА, а не любой не-цифровой знак: вторая
    # строка плашки наборщика кончается «CharCount = 0», и шаблон с \D
    # брал этот ноль колонцифрой на всех 736 полосах.
    - '[A-Za-z]\s+(\d{1,4})$'

junk:
  # Снимается и плашка наборщика, и колонтитул — обе выше 0.15.
  header_band: 0.16
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
