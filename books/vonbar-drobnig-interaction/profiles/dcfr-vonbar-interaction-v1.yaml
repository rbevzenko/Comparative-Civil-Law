id: dcfr-vonbar-interaction-v1
publisher: Sellier European Law Publishers
jurisdiction: Comparative literature
language: en
# Christian von Bar & Ulrich Drobnig, The Interaction of Contract Law and
# Tort and Property Law in Europe. Исследование для Европейской комиссии,
# 574 полосы, цифровой PDF, одна колонка, кегль тела 9.5, сноски 5.6–6.0.
#
# ГЛАВНАЯ ОСОБЕННОСТЬ ФАЙЛА: в текстовом слое нет пробельных глифов вовсе.
# pdfplumber.extract_text() выдаёт «Onthe22ndMay2002theEuropeanCommission»
# сплошняком. Слова восстанавливаются только по зазорам между глифами —
# этим занимается _space_gap в pipelib. Порог подбирался на выборке: см.
# журнал решений.
#
# Единица цитирования — нумерованный абзац «13. Strategy document»: номер
# в начале строки, дальше жирный лид-ин и текст.

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    # Точка и пробел обязательны, дальше — заглавная буква или кавычка.
    # Без этого под шаблон уходят годы («2002. In this…») и номера статей.
    pattern: '^(\d{1,3})\.\s(?=[A-Z“‘(\[])'
    address_template: "para. {number}"

address:
  template: "para. {number}"

footnotes:
  # Сноски набраны кеглем 8.5 против 9.5 у тела — разница в один пункт, но
  # выдержана по всей книге. Кегль 5.6 — это НАДСТРОЧНЫЕ ЗНАКИ в тексте, а
  # не аппарат; они вклеиваются отдельным шагом (inline_superscripts.py).
  # Порог задан ЯВНО. По умолчанию он берётся как медиана кегля минус
  # полтора пункта, то есть 8.0 — и сноски кеглем 8.5 в него не попадают.
  mode: font_bottom
  note_size_max: 8.8
  # Аппарат на иных полосах занимает половину: замерено по выборке, самый
  # высокий блок начинается на 0.499 высоты. Полоса взята с запасом; тело
  # от сносок отделяет КЕГЛЬ (9.5 против 8.5), а не положение.
  bottom_band: 0.45

printed_page:
  # Колонтитул вверху полосы: «8 Introduction» на чётных, «Introduction 9»
  # на нечётных. Номер отдельной строкой не стоит нигде, поэтому нужны
  # паттерны. Верхняя полоса 0.05: колонтитул сидит на 0.025 высоты, при
  # 0.0 строка не попадает в полосу вовсе.
  band: [0.05, 0.05]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '\D\s+(\d{1,4})$'

junk:
  patterns: []

statutory:
  patterns:
    - '\bArt(?:icle)?\.?\s?\d+[a-z]?\b'
    - '\b§\s?\d+[a-z]?\b'
