id: dcfr-gordley-comparative-v1
publisher: Cambridge University Press
jurisdiction: DCFR
language: en
# James Gordley & Arthur Taylor von Mehren, An Introduction to the
# Comparative Study of Private Law. Readings, Cases, Materials (2006).
# 736 полос, цифровой PDF, одна колонка.
#
# Кегли: 10.0 тело И КОЛОНЦИФРА, 9.0 колонтитул, 8.0 сноски, 6.6 знак
# сноски в тексте, 17.9 заголовки.
#
# Пробельных глифов в текстовом слое нет: «THESTRUCTUREOFCONTRACTLAW»
# сплошняком. Слова восстанавливает _space_gap.
#
# Хрестоматия: тело перемежается извлечениями из судебных решений и
# кодексов. Нумерованных абзацев нет, единица — ПОЛОСА, адрес — печатная
# страница.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.35

printed_page:
  # Колонтитул на 31 из 692 — это 0.045. Номер стоит слева на чётной
  # полосе и справа на нечётной, поэтому шаблона два.
  band: [0.06, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '\D\s+(\d{1,4})$'

junk:
  header_band: 0.07
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
