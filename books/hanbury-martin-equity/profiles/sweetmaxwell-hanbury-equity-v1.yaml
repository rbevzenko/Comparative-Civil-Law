id: sweetmaxwell-hanbury-equity-v1
publisher: Sweet & Maxwell
jurisdiction: EN
language: en
# Hanbury & Martin, Modern Equity, 17th ed. (Jill E. Martin, 2005).
# Скан с текстовым слоем OCR, 1022 листа, тело f101–f1021.
# Указателя в скане нет вовсе.
#
# Единица цитирования — номер абзаца «глава-номер» через дефис: «1-036».
# Номер стоит на ВНЕШНЕМ поле и меняет сторону разворота: на одной полосе
# он и так первое слово строки (539 случаев), на другой — последнее (1039).
#
# Второй случай переносит в начало строки
# scripts/move_margin_numbers.py --from-text. Геометрия тут не работает:
# правый край строк тела распадается на два скопления (430 и 470–480 pt) —
# полосы сняты с разным масштабом, — а номер как последнее слово начинается
# на 400–440 pt, то есть диапазоны ПЕРЕСЕКАЮТСЯ. Вдобавок `_space_gap` на
# большинстве полос не находит границ слов, и вся строка становится одним
# словом. Поэтому свой номер от перекрёстной ссылки («see para. 3-042»)
# отличает СЧЁТ: номер абзаца по книге возрастает, ссылка — нет.
#
# Аппарат сносок не отделяется: знак сноски в OCR приклеивается к слову
# («Baltimore*1» вместо «Baltimore81»), номер не восстанавливается, а без
# номера сноска не грузится.

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    pattern: '^\d{1,2}-(\d{3})(?=\s|$)'
    address_template: "{section}-{number}"

address:
  template: "{section}-{number}"
  section:
    mode: pattern
    pattern: '^(\d{1,2})-\d{3}(?=\s|$)'

footnotes:
  mode: none

printed_page:
  # Колонцифра в колонтитуле: «900 Licences and Estoppel» на чётной,
  # «Licences by Estoppel 899» на нечётной. Нижняя полоса выключена.
  band: [0.105, 0.0]
  patterns:
    - '^(\d{1,4})\s'
    - '\s(\d{1,4})$'

junk:
  header_band: 0.105
  patterns:
    # Постраничное оглавление главы на её первой полосе: «iii. Registration
    # .......................... 1-046». Номер там стоит в конце строки
    # ровно как на поле, и без этого он сбивает счёт абзацев в самом начале
    # главы: приняв 1-046 первым, разбор отвергает все настоящие 1-001…1-045.
    - '\.\s?\.\s?\.'


statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\.?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\b\d{1,2}-\d{3}\b'

citation:
  template: "{cite_as} {address}"
