id: ocr-tmp-v1
publisher: Sellier European Law Publishers
jurisdiction: DCFR
language: en
# Временный профиль ТОЛЬКО для прогона OCR: на этом шаге важны язык и dpi,
# а не единица цитирования. Настоящий профиль собирается по распознанному
# тексту — до OCR о вёрстке скана известно слишком мало.
units:
  - type: "p."
    id_prefix: "p"
    mode: page
address:
  template: "p. {number}"
footnotes:
  mode: none
printed_page:
  band: [0.08, 0.08]
  patterns:
    - '^(\d{1,4})$'
    - '^(\d{1,4})\s+\D'
    - '\D\s+(\d{1,4})$'
junk:
  patterns: []
