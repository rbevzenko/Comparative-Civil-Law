id: sweet-maxwell-snell-v1
publisher: Sweet & Maxwell
jurisdiction: UK
language: en
# John McGhee & Steven Elliott (eds.), Snell's Equity, 34th ed., 2020.
# Издательский PDF, 1155 страниц, одна колонка, английский язык.
#
# Единица цитирования — номер абзаца вида «3-031»: глава-порядковый номер
# внутри главы. Так книга и цитируется: Snell's Equity, 34th edn, para.3-031.
# Номер стоит НА ПОЛЕ, снаружи полосы набора, и меняет сторону по развороту:
# на одной странице он первым словом строки у левого поля (x0≈28), на другой
# последним словом у правого (x0≈391 при правом крае полосы 391).
# Штатный режим margin здесь не годится: pull_margin_tokens берёт с поля
# только голое число \d{1,4}, а тут номер составной. Поэтому перед extract
# идёт scripts/move_margin_numbers.py, который переносит номер с правого
# поля в начало своей строки, и дальше работает обычный flow.

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    pattern: '^\d{1,2}-(\d{3})\s'
    address_template: "para. {section}-{number}"

address:
  template: "para. {section}-{number}"
  section:
    # Раздел — глава: он же первая половина номера абзаца. Читать его из
    # самого номера надёжнее, чем из оглавления файла: узлы outline
    # озаглавлены голыми числами («1-1», «2-2», «3»), а их адреса
    # назначения местами разъезжаются с началом главы.
    mode: pattern
    pattern: '^(\d{1,2})-\d{3}\s'

footnotes:
  # Тело 10.0, сноски 8.0, цитаты-выдержки 9.0, знак сноски 6.0 верхним
  # индексом. Полоса взята с запасом вверх (0.50): блок сносок на плотных
  # полосах поднимается до 0.64, а телом кегль 8 не набирается нигде.
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.50

printed_page:
  # Колонцифра стоит отдельной строкой внизу в квадратных скобках: «[45]»,
  # её нижний край на 0.936 высоты. Встроенного правила достаточно, паттерны
  # не нужны, но полосу надо сузить до 0.07: при 0.12 в верхнюю полосу
  # попадает знак сноски, уехавший на свою строку («188» на 0.08 высоты), и
  # он читается как номер страницы, а сама строка снимается как колонтитул.
  band: 0.07

junk:
  # Колонтитул набран капителью в две строки (заглавные кеглем 9, остальные
  # 6), нижний край 0.059 высоты.
  header_band: 0.07
  patterns:
    # Оглавление главы, набранное на её первой полосе: строки с отточием.
    # Номера абзацев в них стоят внутри полосы (x0 ≤ 377) и единицами не
    # становятся, но текст оглавления попал бы в карточку и в иерархию.
    # Точки отточия разделены пробелами, поэтому шаблон с пробелом.
    - '(?:\.\s?){5,}'
    # У части строк оглавления отточие редкое — всего две-три точки («…Which
    # Ought to be Done . . 5-015»), и под шаблон выше они не подходили: 23
    # такие строки становились узлами иерархии вместе с прилипшим к ним
    # куском абзаца. Здесь порог опущен до двух точек, но строка должна
    # КОНЧАТЬСЯ номером абзаца — иначе шаблон снимал бы и текст книги с
    # многоточием в квадратных скобках («debate of general interest [...]»).
    - '(?:\.\s?){2,}\s*\d{1,2}-\d{3}\s*$'

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+s\.?\s*\d+[A-Za-z]*)?'
    - '\bs\.\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '(?:para|paras)\.?\s*\d{1,2}-\d{3}'
    - '\bCh\.\s?\d{1,2}\b'

citation:
  template: "{cite_as} {address}"
