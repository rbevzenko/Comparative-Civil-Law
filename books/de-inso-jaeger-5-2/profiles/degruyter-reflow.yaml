id: degruyter-grosskommentar-reflow-v1
publisher: De Gruyter
jurisdiction: DE
language: de
# Том 5.2 Егера свёрстан иначе, чем остальные восемнадцать: это не печатная
# полоса, а перевёрстанная электронная копия. Полоса 612 pt шириной, тело
# кеглем 15.0 с x0 77, колонцифры нет вовсе, а номер Randnummer стоит
# ОТДЕЛЬНОЙ строкой кеглем 16.9 — не на поле и не в начале абзаца. Штатный
# `mode: margin` на нём дал 55 карточек на 1569 полос.

units:
  - type: "Rdn."
    id_prefix: "rdn"
    mode: flow
    pattern: '^(\d{1,4})$'
    size_min: 16.0        # тело набрано 15.0, номер крупнее

footnotes:
  # Кегли на полосе три: тело 15.0, заголовки и номера 16.9, аппарат 11.2.
  mode: font_bottom
  bottom_band: 0.30
  note_size_max: 12.0

printed_page:
  band: 0.04              # колонцифры нет; полоса узкая, чтобы ничего не ловить

junk:
  patterns:
    - '^https?://'

address:
  section:
    mode: pattern
    pattern: '^§\s?(\d+[a-zä]?)$'
    anchor: start

citation:
  # Комментатор подставляется позже section_from_page_head.py.
  template: "Jaeger, InsO, {address}"
