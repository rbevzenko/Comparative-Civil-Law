id: oup-lawson-rudden-property-v1
publisher: Oxford University Press
jurisdiction: EN
language: en
# F. H. Lawson & Bernard Rudden, The Law of Property, 3rd ed. (Clarendon Law
# Series). Скан Internet Archive с текстовым слоем OCR, 226 страниц,
# тело f17–f214.
#
# Файл сканированный, и это видно по всему: кегль тела гуляет от 8.8 до 9.5
# на одной полосе, левое поле — от 9 до 44 пунктов от страницы к странице,
# высота полосы тоже разная. Поэтому все пороги здесь заданы в долях
# высоты, а не в пунктах, и порога кегля у единицы нет вовсе.
#
# СВОЕЙ ЕДИНИЦЫ ЦИТИРОВАНИЯ У КНИГИ НЕТ: абзацы не нумерованы. Единица —
# типографская страница, ею книга и цитируется.
#
# Резать по заголовкам не вышло: заголовок («THE SUBJECT», «SOURCES OF
# PROPERTY LAW», «3. GOODS») стоит раз в четыре полосы, и на 198 полос их
# всего 39. Девять таких карточек длиннее 18 000 знаков, а эмбеддер видит
# только первые 18 000 — то есть половина книги в поиск не попадала бы.
# Кегль заголовку тут не помощник: в OCR-слое шрифт один на всю книгу
# (GlyphLessFont), а кегль тела гуляет от 8.8 до 9.5 на одной полосе.

units:
  - type: "p."
    id_prefix: "p"
    mode: page
    address_template: "p. {number}"

address:
  template: "p. {page}"

footnotes:
  # Аппарат НЕ отделяется. Знак сноски в OCR-слое читается как угодно —
  # «‘», «>», «*», «3», — и номер у 128 блоков из 130 не восстанавливается
  # вовсе. Отделить их значит выбросить текст сносок из корпуса: без номера
  # они не грузятся. Пусть остаются внизу своей карточки, где и напечатаны.
  mode: none

printed_page:
  # Колонцифра в колонтитуле: «4 Introduction» на чётной,
  # «Classification of Things 25» на нечётной. Нижняя полоса выключена.
  band: [0.08, 0.0]
  patterns:
    - '^(\d{1,4})\s'
    - '\s(\d{1,4})$'

junk:
  header_band: 0.075

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns: []

citation:
  template: "{cite_as} {address}"
