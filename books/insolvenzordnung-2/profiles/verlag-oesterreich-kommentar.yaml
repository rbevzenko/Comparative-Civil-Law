id: verlag-oesterreich-kommentar-v1
publisher: Verlag Österreich
jurisdiction: AT
language: de
# Koller/Lovrek/Spitzer, Insolvenzordnung², Verlag Österreich 2023.
# Издательский PDF, 3727 страниц, sha256 7ae006eb3497af8e…
#
# Том комментирует ЧЕТЫРЕ акта сразу: IO (372 §), ReO (50 §), EKEG (20 §) и
# EuInsVO (статьи). Номера параграфов между ними повторяются — «§ 1» есть и в
# IO, и в ReO, и в EKEG, всего 50 пересечений. Поэтому одного «§ N» в адресе
# мало, и после нарезки запускается qualify_sections.py: он дописывает в
# адрес код акта со страничного колонтитула («§7 ReO Reisch», «Art45 EuInsVO
# Weber-Wilfert»). Без этого шага id карточек столкнутся, а ссылка «§ 3 Rz 5»
# станет двусмысленной.

units:
  - type: "Rz"
    id_prefix: "rz"
    mode: margin

margin:
  side: outer          # recto — поле справа, verso — слева
  parity: printed      # смещение постоянно (printed = file − 69) и колонцифра
                       # читается на 100% страниц, так что сторону разворота
                       # можно считать честно по типографской странице
  scope: book          # коридор маргиналий ищется по всей книге, а не по
                       # каждой странице: файл ровный, а вот постраничная
                       # мера полосы сбивается на первой странице параграфа —
                       # текст закона там набран с отступом, и его цифры
                       # «1.», «2.», «3.» садятся ровно туда, где постранично
                       # ожидается поле. Так книга получала 37 карточек из
                       # цифр самого закона, а не из номеров комментария.
  pad: 2.0

hierarchy:
  # Зашитое оглавление тянется от f6 (Vorwort) до f3712 (Stichwortverzeichnis
  # EuInsVO). Без отсечения предисловия и указатели всплывают в иерархии
  # карточек как её верхние узлы.
  outline_pages: [70, 3629]

address:
  section:
    mode: outline      # § берётся из зашитого в файл оглавления: 442 узла
    outline_pattern: '(?:§|Artikel)\s*(\d+[a-z]?)'

footnotes:
  # Кегли здесь дискретные, файл издательский: тело 9.5 (72% текста), сноски
  # 8.0 (19%), аппарат параграфа — Lit-списки, Inhaltsübersicht, «idF» — 8.5
  # (7%), знаки сносок 6.2. Граница 8.2 отделяет сноски от аппарата, зазор
  # всего полпункта, но кегли точные, а не измеренные по скану.
  mode: font_bottom
  note_size_max: 8.2
  # Полоса низкая нарочно: на 153 проверенных страницах текста тела ниже
  # начала блока сносок не встретилось ни разу, а сам блок на плотных
  # страницах поднимается до 0.19 высоты полосы.
  bottom_band: 0.15

printed_page:
  band: 0.06
  patterns: []         # колонцифра стоит отдельной строкой внизу полосы;
                       # паттерны не нужны и опасны — в колонтитуле сверху
                       # стоит номер параграфа, и он бы утёк в пагинацию

junk:
  header_band: 0.075   # колонтитул «§3 Kodek» / «Rechtshandlungen … §3»;
                       # снимается ПОСЛЕ чтения колонцифры
  footer_band: 0.92
  patterns:
    # Оглавление параграфа (Inhaltsübersicht) — строки с отточием, у которых
    # справа стоит номер Rz. Этот номер попадает ровно в коридор маргиналий,
    # и без чистки книга получает 662 карточки-призрака: у каждого параграфа
    # его оглавление превращается в дубль его же первых Rz.
    - '\.\s?\.\s?\.\s?\.\s?\.'

statutory:
  patterns:
    - '§+\s*\d+[a-z]?\s*(?:Abs\s*\d+\s*)?(?:IO|KO|AO|ReO|EKEG|ABGB|EO|UGB|GmbHG|AktG|ASGG|ZPO|JN|URG|IESG|KSchG)'
    - '§§\s*\d+[a-z]?\s*(?:ff|f)?'
    - 'Art\s*\d+\s*(?:Abs\s*\d+\s*)?EuInsVO'

cross_refs:
  patterns:
    - '(?:oben|unten|siehe|vgl|dazu)\s+Rz\s*\d+(?:\s*(?:ff|f)\.?)?'
    - '§\s*\d+[a-z]?\s*Rz\s*\d+'

citation:
  template: "{cite_as} {address}"
