id: dcfr-kotz-ecl-v1
publisher: Oxford University Press
jurisdiction: Comparative literature
language: en
# Hein Kötz, European Contract Law, 2nd ed. (2017), перевод T. Mertens и
# G. Weir. Не типографский PDF, а переверстанная электронная книга: кегль
# тела 14.4 на всех полосах, КОЛОНТИТУЛОВ И КОЛОНЦИФР НЕТ ВОВСЕ — ни вверху,
# ни внизу полосы нет ничего, кроме текста. Цитировать по номеру страницы
# файла нельзя: он не совпадает с печатным изданием.
#
# Нумерованных абзацев в книге тоже нет. Поэтому единица — ПОЛОСА, а адрес
# строится от главы и раздела: «ch. 2 B-3» — третий фрагмент раздела B
# второй главы. Так фрагмент остаётся привязан к тому месту книги, которое
# читатель может найти по оглавлению.
#
# Кегли: 14.4 тело, 10.8 сноски, 16.6 раздел («A. Introduction»),
# 23.8 название главы, 28.8 её номер.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  # Аппарат НЕ отделяется — намеренно.
  #
  # Сноски в этой книге собраны блоками в конце раздела, а не внизу своей
  # полосы: f61 и f151 заняты аппаратом целиком и начинаются продолжением
  # сноски с предыдущей полосы. Знак сноски стоит на одной полосе, а сама
  # сноска — через десять. Привязка «знак на полосе → сноска на той же
  # полосе» тут не работает: из 1244 собранных сносок к карточкам
  # прицепились 141, остальные при выгрузке потерялись бы.
  #
  # Аппарат здесь — треть книги и состоит из ссылок на французские,
  # немецкие и голландские источники, то есть ровно из того, ради чего
  # корпус и собирается. Поэтому он остаётся в тексте полосы и ищется
  # вместе с ней.
  mode: none

printed_page:
  # Печатать нечего.
  band: 0.0

junk:
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§\s?\d+[a-z]?\b'
