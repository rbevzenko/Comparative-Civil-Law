id: degruyter-grosskommentar-v1
publisher: De Gruyter
jurisdiction: DE
language: de
# Stein/Jonas, Kommentar zur Zivilprozessordnung, и Jaeger, Insolvenzordnung —
# одна издательская линейка «Großkommentare der Praxis». Полоса 482×680 pt,
# тело кеглем 9.0 с x0 85, номер Rdn. висит слева на 65, аппарат внизу под
# линейкой кеглем 7.5, а в самом низу строка «Kruis 88»: комментатор и
# колонцифра.

units:
  - type: "Rdn."
    id_prefix: "rdn"
    mode: margin

margin:
  # Номер стоит на ВНЕШНЕМ поле: на чётной полосе слева от набора (x0 ≈ 68
  # при полосе с 85), на нечётной справа (x0 ≈ 403 при правом крае 399).
  # Пока в профиле стояло `left`, нечётные полосы не давали ни одного номера,
  # и ряд выглядел так: 1-5, 13-18, 27-31 — то есть ровно через страницу.
  # Стороны не задаём вовсе: номер берётся с ЛЮБОГО поля. Пробовали `outer`
  # с чётностью по колонцифре — и напоролись на то, что чётность берётся из
  # колонцифры, а она читается не на всякой полосе: у тома 2 Егера на трети
  # полос вместо номера страницы прочитано случайное число (15, 23, 4), и
  # разборщик искал номер не с той стороны, теряя треть единиц. Признак
  # «первое слово левее полосы набора или последнее правее» и сам по себе
  # достаточно узок.
  scope: page
  pad: 2.0

footnotes:
  # Аппарат отбит линейкой «_____» и набран кеглем 7.5 против 9.0 в теле.
  mode: font_bottom
  # Полосу берём низкой, а не 0.70: у Stein/Jonas аппарат на иных полосах
  # занимает больше трети страницы и начинается выше. Пока полоса стояла на
  # 0.70, 277 строк аппарата оставались в теле — и каждая, начинаясь с номера
  # сноски, выглядела как новая единица. Отделяет их всё равно кегль (7.5
  # против 9.0), полоса лишь ограничивает, где искать.
  bottom_band: 0.30
  note_size_max: 8.0

printed_page:
  # Колонцифра стоит в самом низу, рядом с фамилией комментатора: «Kruis 88»
  # на нечётной полосе и «88 Kruis» на чётной. Полоса берётся парой, чтобы
  # середина страницы не просматривалась вовсе.
  band: [0.06, 0.09]   # доля СВЕРХУ и доля СНИЗУ, а не координата
  max_chars: 40
  patterns:
    # Нечётная полоса: «Kruis 88». Чётная: «88 Kruis». Голое число без
    # фамилии брать нельзя — под него подходит любая строка аппарата,
    # начинающаяся с номера сноски.
    - '^[A-ZÄÖÜ][A-Za-zÄÖÜäöüß/.\- ]{2,30}\s(\d{1,4})$'
    - '^(\d{1,4})\s[A-ZÄÖÜ][A-Za-zÄÖÜäöüß/.\- ]{2,30}$'

junk:
  header_band: 0.055   # колонтитул «§ 4 | Erstes Buch – Allgemeine Vorschriften»
  patterns:
    - '^https?://doi\.org/'

statutory:
  patterns:
    - '§+\s*\d+[a-z]?\s*(?:Abs\.?\s*\d+\s*)?(?:ZPO|BGB|GVG|InsO|HGB|FamFG|GKG|RVG|EGZPO)'
    - '§§\s*\d+[a-z]?\s*(?:ff|f)?'

cross_refs:
  patterns:
    - '§\s*\d+[a-z]?\s*Rdn\.?\s*\d+'
    - '(?:oben|unten|siehe|vgl\.?|dazu)\s+Rdn\.?\s*\d+'

address:
  # Параграф — часть адреса, а не иерархии: «Rdn. 164» без «§ 4» указывает
  # на девять разных мест тома. Номер берётся из колонтитула, потому что в
  # теле полосы его нет вовсе.
  section:
    # Заголовок параграфа стоит в теле отдельной строкой («§4», следом
    # «Wertberechnung; Nebenforderungen»), и он и есть точка переключения.
    # Колонтитул для этого не годится: на полосе, где параграф начинается
    # с середины, он показывает УЖЕ НОВЫЙ параграф, и верхняя половина
    # полосы уехала бы к нему.
    mode: pattern
    pattern: '^§\s?(\d+[a-zä]?)$'
    anchor: start

citation:
  template: "Jaeger, InsO, {address}"
