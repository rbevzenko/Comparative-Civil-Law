id: dcfr-reid-succession-vol3-v1
publisher: Oxford University Press
jurisdiction: DCFR
language: en
# K. G. C. Reid, M. J. de Waal, R. Zimmermann (eds), Comparative Succession Law. Volume III: Mandatory Family Protection (2020). 826 полос. Тело 10.0, сноски 8.0, колонтитул на 59 из 711.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  mode: font_bottom
  note_size_max: 9.5
  bottom_band: 0.45

printed_page:
  band: [0.095, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '[A-Za-z]\s+(\d{1,4})$'

junk:
  header_band: 0.10
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
