id: peicl-sellier-v1
publisher: Verlag Dr. Otto Schmidt
jurisdiction: DCFR
language: en
# Principles of European Insurance Contract Law (PEICL), полное издание с
# правилами, комментариями и национальными заметками. Файл распознан
# владельцем: 976 полос, текстовый слой на каждой, оглавление зашито
# (1181 узел), колонцифра читается на всех со смещением −54.
#
# ЕДИНИЦА — СТАТЬЯ: «Article 1:103». Двоеточия после номера в заголовке НЕТ,
# в отличие от серии PEL: «Article 1:103 Mandatory Character».
#
# ВНУТРИ СТАТЬИ книга помечает части сама: «C4.» для комментария, «N1.» для
# национальной заметки. Это не наша выдумка — собственный указатель книги
# ссылается ровно так: «Art. 1:101 C6», «Art. 2:202 N1». Дробление делает
# split_article_commentary.py --marker-style cn.
#
# ДИАПАЗОН ПОЛОС ОБЯЗАТЕЛЕН, и границы у него две.
#
# Снизу — полоса 114. С 85 по 112 книга печатает ТЕКСТ ВСЕХ СТАТЕЙ подряд,
# без комментария, и лишь с 114 начинается раздел «Rules, Comments and
# Notes», где каждая статья повторена со своим комментарием. Прогон с 85
# дал 301 статью вместо 130 и 178 задвоенных адресов.
#
# Сверху — полоса 423: дальше идут переводы PEICL на полтора десятка языков
# (китайский, чешский, венгерский, турецкий…), три сотни полос, которые
# задвоили бы каждую норму ещё раз. До 84 — оглавление и вступительная
# статья со своей нумерацией «I12».
#
# В паттерне после номера стоит ПРОСМОТР ВПЕРЁД, а не сам знак: длина
# совпадения обрезается со строки, и `\s+\S` съедал первую букву заголовка —
# «Mandatory Character» превращалось в «andatory Character».
#
# И просмотр этот с опорой на контекст, как требует спецификация. Голого
# номера мало: книга полна перекрёстных ссылок, а при переносе строка
# начинается ровно так же — «Article 1:204 para. 2 …». Отсюда 60 задвоенных
# адресов в прогоне. Признак заголовка — за номером идёт КОРОТКИЙ заголовок
# с заглавной буквы И СТРОКА НА ЭТОМ КОНЧАЕТСЯ; у ссылки после номера
# продолжается предложение, обычно со строчной («para.», «second»).

units:
  - type: "Art."
    id_prefix: "art"
    mode: flow
    pattern: '^Article\s*\d+:(\d+)\s+(?=[A-Z][^\n]{0,60}$)'
    address_template: "Art. {section}:{number}"

address:
  section:
    mode: pattern
    pattern: '^Article\s*(\d+):\d+\s+(?=[A-Z][^\n]{0,60}$)'
    anchor: start
  template: "Art. {section}:{number}"

footnotes:
  # Аппарат — блоки Comments и Notes внутри статьи. Сносок в подвале нет.
  mode: none

printed_page:
  # Колонцифра — голое число внизу полосы, низ строки на 0.9375.
  band: [0.07, 0.08]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '\D\s+(\d{1,4})$'
    - '^(\d{1,4})$'

junk:
  # Колонтитул кеглем 8.0 стоит на 0.053, низ на 0.065.
  header_band: 0.075
  patterns: []

statutory:
  patterns:
    - '\bArt(?:icle)?s?\.?\s?\d+:\d+\b'
    - '\bDirective\s+\d+/\d+/E[CU]\b'

citation:
  template: "{authors}, {title}, {publisher}, {year}, {address}"
