id: scan-terre-personnes
publisher: Dalloz, «Précis»
jurisdiction: FR
language: fr
# Скан со СВОИМ распознаванием, качество приличное (0.1% подозрительных слов).
# Тело 15.3, заголовок единицы 18.6, колонтитул 11.1 с колонцифрой,
# сноски 11.7–12.9 внизу полосы.

units:
  - type: "n°"
    id_prefix: "n"
    mode: flow
    # «385 Audition de l’enfant dans une procédure ◊ L’intervention...»
    # Ромб в распознавании читается как «o», поэтому опора на него не годится.
    # Порога по кеглю НЕТ намеренно. В этом скане заголовок единицы набран
    # тем же кеглем, что и тело: «1 Ouverture ◊ Ouvrons un code civil» —
    # 15.1, обычная строка тела — 15.3. Порог 16.0 оставлял 197 единиц из
    # примерно тысячи. Различает их не кегль, а то, что обычная строка тела
    # с числа и заглавной практически не начинается.
    # Справа от номера бывает и рубрика: «43 1° Le corps», «67 3 ° Les
    # principes», «68 a) L’intégrité du corps humain». Без них терялось 260
    # номеров из 939.
    pattern: '^(\d{1,4})\s+(?=[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇŒÆ«“]|\d\s*[°º]|[a-z]\s*\))'

address:
  section:
    mode: none
  template: "{unit_type} {number}"

printed_page:
  band: [0.06, 0.0]
  patterns:
    - '^(\d{1,4})\s+[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇL]'
    - '\s(\d{1,4})$'

footnotes:
  mode: font_bottom
  body_size: 15.3
  note_size_max: 13.2
  bottom_band: 0.35

junk:
  patterns:
    - '^[·~\-—_]{4,}$'

statutory:
  patterns:
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*(?:\s*(?:et|à|,)\s*\d+(?:-\d+)*)*\s*(?:C\.\s*civ\.|du Code civil)'
    - 'L\.\s*\d{3}-\d+'

cross_refs:
  patterns:
    - '(?:supra|infra)\s*,?\s*n[o°s]*\s*\d+(?:\s*(?:et|à|,)\s*\d+)*'

citation:
  template: "{authors}, {title}, {edition}, {publisher}, {year}, {address}"
