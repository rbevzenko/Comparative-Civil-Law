id: westlaw-proview-export-v1
publisher: Sweet & Maxwell
jurisdiction: UK
language: en
# Профиль выгрузки Westlaw/ProView, а не типографского PDF. Так свёрстаны
# Chitty on Contracts 32nd ed. (оба тома) и Goff & Jones on Unjust
# Enrichment 9th ed.: страница выгрузки, а не книги, вверху её собственный
# номер («Page151»), под ним путь по структуре тома, внизу знак копирайта.
#
# Единица цитирования — номер абзаца «глава-номер» (1-136), и стоит он
# ОТДЕЛЬНОЙ строкой, а над ним свой заголовок. Заголовок сращивается с
# номером скриптом scripts/join_heading_to_number.py — иначе он достаётся
# хвосту предыдущей карточки.
#
# Типографской пагинации в выгрузке нет вовсе: «Page151» — номер страницы
# файла, и выдавать его за страницу книги нельзя.

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    pattern: '^\d{1,2}-(\d{3})\b'
    address_template: "para. {section}-{number}"

address:
  template: "para. {section}-{number}"
  section:
    mode: pattern
    pattern: '^(\d{1,2})-\d{3}\b'

footnotes:
  # Тело 9.96, сноски 8.04, заголовки и номера абзацев 12.0, шапка тома 14.0.
  # Полоса взята очень низкой: блок сносок в этой вёрстке занимает иногда две
  # трети полосы и начинается на 0.29 высоты. Кегль разделяет надёжно —
  # телом 8 не набирается ничего.
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.10

printed_page:
  # Типографской пагинации в файле нет. Полоса сведена к нулю, чтобы
  # встроенное правило не приняло за колонцифру что-нибудь другое.
  band: 0.0

junk:
  patterns:
    - '^Page\d+$'
    - '^© \d{4} Sweet & Maxwell$'
    - '^Chitty on Contracts \d+'
    - '^Goff & Jones'
    - '^Volume \d+ - '
    - '^Mainwork$'
    - '^Part [IVXLC0-9]+ - '
    - '^Chapter \d+ - '
    - '^Section \d+\. - '
    - '^Sub-section \([a-z0-9ivx]+\) - '

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\.\s?\d+[A-Za-z]*(?:\(\d+\))?'
    - '\bart\.\s?\d+(?:\(\d+\))?'

cross_refs:
  patterns:
    - '(?:para|paras)\.?\s*\d{1,2}-\d{3}'
    - '\bCh\.\s?\d{1,2}\b'

citation:
  template: "{cite_as} {address}"
