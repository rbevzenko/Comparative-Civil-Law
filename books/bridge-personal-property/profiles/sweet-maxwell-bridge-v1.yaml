id: sweet-maxwell-bridge-v1
publisher: Sweet & Maxwell
jurisdiction: EN
language: en
# Michael Bridge, The Law of Personal Property, 1st ed. (2013). Издательский
# PDF, 1080 страниц. Кегль тела 9.98, сносок 7.98, знака сноски 4.79,
# колонтитула 7.23, служебной строки набора 8.98.
#
# Единица цитирования — номер абзаца «глава-номер» через ТИРЕ: «1–007».
# Стоит на ВНЕШНЕМ поле и меняет сторону разворота: слева x≈100 (полоса
# начинается с 145), справа x≈470 (полоса кончается на 450–470).
#
# В файле нет карты в Unicode для ПРОПИСНОЙ N: она приходит как «(cid:2)»
# («Franklin v (cid:2)eate»). Возвращает её scripts/map_missing_glyphs.py.

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    # После номера — заголовок абзаца с прописной либо конец строки.
    # Условие обязательное: перекрёстная ссылка при переносе тоже начинает
    # строку номером («36–010 et seq.»), и без него она сбивает счётчик, а
    # четыре настоящие единицы после неё уезжают в предыдущую карточку.
    pattern: '^\d{1,2}[–-](\d{2,3})(?=$|\s+[A-Z“"(\[])'
    address_template: "para. {section}-{number}"

address:
  template: "para. {section}-{number}"
  section:
    mode: pattern
    pattern: '^(\d{1,2})[–-]\d{2,3}(?=$|\s+[A-Z“"(\[])'

footnotes:
  # Хвостом, а не кеглем: кеглем 7.23 набран колонтитул, и правило по кеглю
  # утащило бы его в аппарат.
  mode: none

printed_page:
  # Колонцифра отдельной строкой в квадратных скобках внизу («[4]»), на
  # 0.837 высоты. Полоса должна доставать до неё.
  band: 0.16

junk:
  # Верхняя полоса снимает и служебную строку набора (0.074), и колонтитул
  # (0.143); тело начинается с 0.17. Такая же служебная строка стоит внизу —
  # её снимает паттерн, и это важно: она набрана кеглем 8.98, крупнее
  # сносок, и без неё не сработал бы хвостовой разрез аппарата.
  header_band: 0.16
  patterns:
    - 'Letterpart Ltd'

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\.\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '(?:para|paras)\.?\s*\d{1,2}[–-]\d{2,3}'

citation:
  template: "{cite_as} {address}"
