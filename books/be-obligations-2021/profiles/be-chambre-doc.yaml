id: be-chambre-doc-obligations-v1
publisher: Chambre des représentants de Belgique
jurisdiction: BE
language: fr
# Парламентские документы Палаты представителей Бельгии (Doc. Chambre):
# законопроекты реформы Гражданского кодекса вместе с мотивами.
#
# Полоса двуязычная и двухколонная. У ЭТОГО документа французский стоит
# СЛЕВА (у документа о личных обеспечениях — справа), поэтому колонка берётся
# --column left. Сторону надо проверять на каждом документе отдельно.
#
# Единица цитирования — комментарий к статье будущего Кодекса: заголовок
# «Art. 9.1.14. Exceptions» и текст под ним до следующего такого заголовка.
# Номер трёхчастный (книга.титул.статья), и это отличает статью Кодекса от
# статей самого законопроекта («Art. 4», «Art. 15»), которые технические:
# вставка титула, вступление в силу, отмена прежних норм.
#
# Сносок в документе нет: ссылки набраны в тексте, в скобках.

units:
  - type: "Art"
    id_prefix: "art"
    mode: flow
    # Номер статьи Кодекса трёхчастный: книга.титул.статья. Пайплайн ведёт
    # нумерацию единиц целыми числами, поэтому в номер идёт последняя часть,
    # а первые две — в раздел; адрес собирается из обеих.
    # Здесь заголовок статьи стоит ОТДЕЛЬНОЙ строкой («Article 5.35»), а
    # рубрика («Dol») — следующей; номер двухчастный: книга.статья.
    # Точка между книгой и номером у трёх статей потерялась при вёрстке
    # («Article 5 100», «Art. 5 127»), поэтому вместо точки допускается
    # и пробел: строка целиком всё равно должна быть заголовком.
    pattern: '^Art(?:icle)?\.?\s+\d+[.\s](\d+)\s*$'
    address_template: "Art. {section}.{number}"

address:
  section:
    mode: pattern
    pattern: '^Art(?:icle)?\.?\s+(\d+)[.\s]\d+\s*$'
    anchor: start
  template: "Art. {section}.{number}"

footnotes:
  mode: none

printed_page:
  # Колонцифра стоит в самой верхней строке полосы, рядом с номером
  # документа; строка с ней снимается по индексу, а не полосой.
  band: 0.06

junk:
  header_band: 0.06
  # Нижняя плашка Палаты стоит на 0.929 высоты — полоса 0.94 её не достаёт.
  footer_band: 0.92
  patterns:
    - '^DOC\s+\d+\s+\d+/\d+$'
    # В плашке буквы разрежены пробелами («CHA MBRE», «LÉGISL ATURE»), и
    # обычное слово в паттерне её не ловит.
    - 'CHA\s?MBRE|KA\s?MER|LÉGISL\s?ATURE|ZITTINGSPERIODE'

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s*\d+(?:\.\d+)*(?:\s*(?:du|de la)\s*(?:Code civil|C\.\s*civ\.))?'
    - '\bloi du \d{1,2} \w+ \d{4}'

cross_refs:
  patterns:
    - '(?:voir|cf|supra|infra)\s+art(?:icle)?\.?\s*\d+(?:\.\d+)*'

citation:
  template: "{cite_as} {address}"
