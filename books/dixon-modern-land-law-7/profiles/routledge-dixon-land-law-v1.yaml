id: routledge-dixon-land-law-v1
publisher: Routledge
jurisdiction: EN
language: en
# Martin Dixon, Modern Land Law, 7th ed. (Routledge 2010).
# Скан с текстовым слоем OCR, 440 листов, тело f41–f430.
#
# Кегли: тело 22.8–23.3, заголовок раздела 36.4–39.4, подраздела 28.0–30.6,
# сноски 16.4, колонтитул 20.9.
#
# У книги ЕСТЬ своя единица цитирования — нумерованный раздел «1.2.1
# Estates in land», — но в этом скане её не собрать. Прогон по заголовкам
# дал 50 разрывов нумерации и 3 дубля адреса на 354 карточки, и причины не
# чинятся правилами:
#
#   * OCR путает цифры в самом номере: «1.s.4» вместо «1.5.4», «0.11»
#     вместо «10.11». Пропадают в основном 5 и 8.
#   * Первая цифра читается неверно систематически: «7.3 Legal and
#     Equitable Easements» приходит как «1.3». Это чинится счётом глав
#     (scripts/fix_chapter_prefix.py, дублей стало 3 вместо 11), но
#     остальное — нет.
#   * У подразделов номер и название стоят РАЗНЫМИ строками, причём номер
#     ПОСЛЕ названия: сначала «The Land Charges Act 1972» кеглем 30, потом
#     «1.s.4» кеглем 19.
#
# Неверный адрес раздела хуже адреса по странице, поэтому единица здесь —
# типографская страница (режим `page`), как у остальных сканов корпуса.
#
# Полосы с оглавлением главы («Chapter Contents») всё равно снимаются
# целиком: текста книги на них нет.
#
# Аппарат сносок не отделяется: знак сноски в OCR разбит на цифры («13 7»,
# «I 40»), номер не восстанавливается, а без номера сноска не грузится.
# Пусть остаётся внизу своей карточки.

units:
  - type: "p."
    id_prefix: "p"
    mode: page
    address_template: "p. {number}"

address:
  template: "p. {number}"

footnotes:
  mode: none

printed_page:
  # Колонцифра в колонтитуле: «450 ADVERSE POSSESSION» на чётной,
  # «CHAPTER SUMMARY 451» на нечётной. Нижняя полоса выключена.
  band: [0.06, 0.0]
  patterns:
    - '^(\d{1,4})\s'
    - '\s(\d{1,4})$'

junk:
  header_band: 0.055

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns: []

citation:
  template: "{cite_as} {address}"
