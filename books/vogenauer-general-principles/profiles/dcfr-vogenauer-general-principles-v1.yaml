id: dcfr-vogenauer-general-principles-v1
publisher: Oxford University Press
jurisdiction: DCFR
language: en
# Stefan Vogenauer & Stephen Weatherill (eds), General Principles of Law. European and Comparative Perspectives (2017). 431 полоса. Тело 10.0, сноски 8.0, колонтитул 10.0 с колонцифрой на 47 из 663.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.40

printed_page:
  band: [0.09, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '[A-Za-z]\s+(\d{1,4})$'

junk:
  header_band: 0.10
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
