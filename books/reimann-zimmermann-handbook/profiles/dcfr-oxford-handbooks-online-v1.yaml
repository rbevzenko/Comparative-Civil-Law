id: dcfr-oxford-handbooks-online-v1
publisher: Oxford University Press
jurisdiction: Comparative literature
language: en
# Mathias Reimann & Reinhard Zimmermann (eds), The Oxford Handbook of
# Comparative Law. 1758 полос — это РАСПЕЧАТКА ИЗ Oxford Handbooks Online,
# а не типографский PDF, и устроена она иначе всех остальных книг рубрики.
#
# Колонцифры у неё нет: внизу полосы стоит «Page 12 of 39» — номер внутри
# ГЛАВЫ, а не книги. Зато настоящие номера печатного издания вставлены
# прямо в текст пометкой «(p. 65)» там, где в книге кончалась страница.
# Пометка стоит в СЕРЕДИНЕ строки, поэтому перед extract.py строка
# разрезается по ней (split_at_page_markers.py), и дальше книга разбирается
# на карточки-страницы обычным flow-режимом.
#
# Кегли: 10.5 тело, 11.2 колонтитул с названием главы, 7.5 юридическая
# плашка «PRINTED FROM OXFORD HANDBOOKS ONLINE…» внизу КАЖДОЙ полосы,
# 6.0 «Page N of M», 7.9 знак сноски.
#
# Сноски печатаются не внизу полосы, а в конце главы сплошным текстом
# («(107) This meaning pre…»), и отделить их кеглем нельзя: они набраны
# тем же 10.5. Поэтому аппарат не отделяется, а остаётся в тексте.

units:
  # Пометки «(p. 65)» в тексте есть, но их всего 51 на 1679 полос — это не
  # каждая страница, а редкие вставки. Единицей они служить не могут.
  # Единица названа «frg.», а не «p.»: номер — это номер полосы ФАЙЛА.
  # Печатной колонцифры у распечатки нет вовсе, а «Page 12 of 39» внизу —
  # номер внутри главы, а не книги.
  - type: "frg."
    id_prefix: "frg"
    mode: page

address:
  template: "frg. {number}"

footnotes:
  mode: none

printed_page:
  # Колонцифры нет; номер берётся из пометки в тексте.
  band: 0.0

junk:
  # Сверху колонтитул с названием главы (31 из 841), снизу «Page N of M»
  # (764) и юридическая плашка (776–810). Полосы взяты по ним.
  header_band: 0.05
  # ВНИМАНИЕ: footer_band отсчитывается СВЕРХУ, а не снизу — снимается всё,
  # у чего top >= height * footer_band. Плашка стоит на 764 из 841, то есть
  # на 0.908. Ошибочные 0.10 срезали почти всю полосу: на страницу
  # оставалось по две строки и 140 знаков вместо трёх тысяч.
  footer_band: 0.90
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
