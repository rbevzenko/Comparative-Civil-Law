id: beck-bamberger-v1
publisher: C.H. Beck
jurisdiction: DE
language: de
# Распознанный скан. Полоса 595.5×921.8, тело кеглем ~10.5, аппарат сносок
# кеглем 9.4 с номером первым словом, номер Rn. висит на ВНЕШНЕМ поле
# (справа на нечётной, слева на чётной), в самом низу «Unberath 1157» —
# комментатор и колонцифра.
#
# Кегль здесь НЕ разделитель: распознавание гуляет на десятые доли, а
# колонтитул набран тем же кеглем, что тело. Поэтому параграф берётся не из
# тела, а из колонтитула (section_from_page_head.py), а сам колонтитул
# снимается полосой сверху.

units:
  - type: "Rn."
    id_prefix: "rn"
    mode: margin

margin:
  scope: page
  pad: 0.0

footnotes:
  mode: font_bottom
  bottom_band: 0.68
  note_size_max: 9.9

printed_page:
  # Нижнее окно узкое: между низом последней сноски (847) и подписью полосы
  # (870). Распознавание портит и её саму — «Unberath 16] 3» вместо 1613, —
  # так что часть полос останется без колонцифры, и это нормально.
  band: [0.0, 0.065]
  max_chars: 40
  patterns:
    - '^[A-ZÄÖÜ][A-Za-zÄÖÜäöüß/.\- ]{2,30}\s(\d{1,4})$'
    - '^(\d{1,4})\s[A-ZÄÖÜ][A-Za-zÄÖÜäöüß/.\- ]{2,30}$'

junk:
  header_band: 0.068
  patterns:
    # Übersicht в начале параграфа набрана с отбивкой точками и стоит
    # у левого края: её номера читались как номера Rn. и давали двадцать
    # столкновений адреса на двадцати шести полосах. Распознавание рвёт
    # отбивку на куски («... .. ... .. . .. .»), поэтому образцов два.
    - '\.{4,}'
    - '\.\s\.\s\.'

address:
  section:
    # Только из колонтитула: в теле заголовок параграфа от ссылки внутри
    # текста не отличить — кегли на скане неотличимы.
    mode: none

citation:
  template: "{cite_prefix} {address}"
