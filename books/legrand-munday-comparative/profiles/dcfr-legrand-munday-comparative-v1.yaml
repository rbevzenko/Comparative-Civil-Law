id: dcfr-legrand-munday-comparative-v1
publisher: Cambridge University Press
jurisdiction: DCFR
language: en
# Pierre Legrand & Roderick Munday (eds), Comparative Legal Studies: Traditions and Transitions (2003). 571 полоса. Тело 10.5, сноски 8.0, колонтитул 10.0 с колонцифрой на 34 из 648.

units:
  - type: "p."
    id_prefix: "p"
    mode: page

address:
  template: "p. {number}"

footnotes:
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.40

printed_page:
  band: [0.07, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '[A-Za-z]\s+(\d{1,4})$'

junk:
  header_band: 0.08
  patterns: []

statutory:
  patterns:
    - '\bart(?:icle)?s?\.?\s?\d+[:\d]*\b'
    - '\b§{1,2}\s?\d+[a-z]?\b'
