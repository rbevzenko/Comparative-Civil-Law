id: dalloz-numerique
publisher: Dalloz (электронное издание, Nord Compo)
jurisdiction: FR
language: fr
# Электронная вёрстка Dalloz: текст перевёрстан под экран, аппарат вынесен на
# отдельные полосы файла и связан с телом ссылками-аннотациями.
# Отличия от бумажного профиля dalloz-lgdj-v1:
#   * сноски НЕ внизу полосы — режим none, привязку делает
#     scripts/footnotes_from_links.py --note-page-size 11.5;
#   * колонцифры у книги нет: число внизу полосы — собственная нумерация
#     электронного издания (3095 полос против примерно 1900 печатных страниц),
#     и выдавать её за страницу книги нельзя.

units:
  - type: "n°"
    id_prefix: "n"
    mode: flow
    # «31 Les éléments de la synthèse. Les rédacteurs du Code civil...»
    # Точки после номера в электронной вёрстке нет.
    #
    # Справа от номера не всегда заглавная: у Терре каждый третий пункт
    # начинается строчной рубрикой — «22 a) La philosophie individualiste»,
    # «25 1) La liberté contractuelle». С требованием заглавной терялось 580
    # номеров из 1932.
    #
    # Рубрика распознаётся ПО СКОБКЕ, а не по строчной букве как таковой:
    # без скобки в паттерн полезли бы даты, которых в этой книге тысячи —
    # «25 mai 1999 relative à certains aspects de la vente...».
    #
    # Перед скобкой допускается пробел: надстрочный знак градуса в «1º)»
    # при разборе теряется и остаётся «1 )». Буква бывает и греческой:
    # рубрики четвёртого уровня у Терре — α), β), γ).
    # В класс заглавных добавлены Œ и Æ (их нет в диапазоне A-Z) и кавычка-
    # ёлочка: заголовки-адагии набраны в кавычках — «570 « Quod nullum
    # est… »». Многоточие — для заголовков, продолжающих предыдущий.
    pattern: '^(\d{1,4})\s+(?=[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇŒÆ«“]|[a-z0-9α-ω]\s*\)|…|\.{2,})'

address:
  section:
    mode: none
  template: "{unit_type} {number}"

printed_page:
  # Число внизу полосы ЧИТАЕТСЯ, но не хранится. Читается — чтобы строка с
  # ним была снята с полосы и не попала в текст карточки. Не хранится —
  # потому что это нумерация файла, а не книги; обнуляет её
  # scripts/blank_printed_pages.py сразу после разбора.
  band: [0.0, 0.12]

footnotes:
  mode: none

junk:
  patterns:
    - 'international\.scholarvox\.com'
    - '^\d{9,}$'

statutory:
  patterns:
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*(?:\s*(?:et|à|,)\s*\d+(?:-\d+)*)*\s*(?:C\.\s*civ\.|du Code civil)'
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*\s*C\.\s*(?:com|consom|pén|proc\.\s*civ)\.'
    - 'L\.\s*\d{3}-\d+'

cross_refs:
  patterns:
    - '(?:supra|infra)\s*,?\s*n[o°s]*\s*\d+(?:\s*(?:et|à|,)\s*\d+)*'

citation:
  template: "{authors}, {title}, {edition}, {publisher}, {year}, {address}"
