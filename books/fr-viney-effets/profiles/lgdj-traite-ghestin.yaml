id: lgdj-traite-ghestin
publisher: LGDJ / Lextenso, «Traité de droit civil» под ред. Ж. Жестена
jurisdiction: FR
language: fr
# Тело 11.0, сноски 8.0 внизу полосы, колонтитул и водяной знак 10.0.
# Знак сноски здесь НЕ надстрочный, а номер в круглых скобках прямо в
# строке — «(134)». Значит, inline_superscripts.py этой книге не нужен.

units:
  - type: "n°"
    id_prefix: "n"
    mode: flow
    # «124. Le principe de réparation intégrale n’est pas absolu. – En France...»
    pattern: '^(\d{1,4})\.\s+(?=[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇŒÆ«“]|\d|\.{2,}|…|[a-z]\.\s)'

address:
  section:
    mode: none
  template: "{unit_type} {number}"

printed_page:
  # Колонцифра в колонтитуле: на чётной полосе слева от названия книги,
  # на нечётной справа от названия раздела. Полоса поиска только верхняя.
  band: [0.07, 0.0]
  patterns:
    - '^(\d{1,4})\s+[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ]'
    - '\s(\d{1,4})$'

footnotes:
  mode: font_bottom
  body_size: 11.0
  note_size_max: 8.5
  bottom_band: 0.25

junk:
  patterns:
    - 'Exemplaire personnel de '

statutory:
  patterns:
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*(?:\s*(?:et|à|,)\s*\d+(?:-\d+)*)*\s*(?:C\.\s*civ\.|du Code civil)'
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*\s*C\.\s*(?:com|consom|pén|proc\.\s*civ)\.'
    - 'L\.\s*\d{3}-\d+'

cross_refs:
  patterns:
    - '(?:supra|infra)\s*,?\s*n[o°s]*\s*\d+(?:\s*(?:et|à|,)\s*\d+)*'

citation:
  template: "{authors}, {title}, {edition}, {publisher}, {year}, {address}"
