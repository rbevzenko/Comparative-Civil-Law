id: oup-street-torts-v1
publisher: Oxford University Press
jurisdiction: UK
language: en
# John Murphy & Christian Witting, Street on Torts, 13th ed. Издательский
# PDF, 819 страниц. Кегль тела 10.2, сносок 8.0, колонтитула 10.5.
#
# СВОЕЙ ЕДИНИЦЫ ЦИТИРОВАНИЯ У КНИГИ НЕТ — только заголовки: «SECTION 6
# DUTIES IN TORT AND CONTRACT» (кегль 12), «(2) Proximity» и «(b) Failure to
# control…» (10.2, то есть кегль тела). Единица — подраздел по заголовку,
# адрес — типографская страница из колонтитула.
#
# Во встроенном шрифте лигатуры Th, fi, fl вынесены отдельными глифами без
# карты в Unicode, и слово рвётся ровно на них: «Th e protection», «at fi
# rst», «which fl ew open». Сращивает scripts/fix_broken_ligatures.py.

units:
  - type: "p."
    id_prefix: "sec"
    mode: heading
    pattern: '^(?:SECTION\s+\d|\([0-9a-z]{1,3}\)\s+[A-Z])[^.]{0,70}$'
    size_min: 10.0
    address_template: "p. {page}"

address:
  template: "p. {page}"

footnotes:
  mode: font_bottom
  note_size_max: 8.6
  bottom_band: 0.25

printed_page:
  # Колонцифра в колонтитуле: «OVERVIEW OF Tort LAW 11».
  band: 0.07
  patterns:
    - '\s(\d{1,4})$'
    - '^(\d{1,4})\s'

junk:
  header_band: 0.065

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\bch\s?\d{1,2}\b'

citation:
  template: "{cite_as} {address}"
