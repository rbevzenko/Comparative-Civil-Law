id: dcfr-sellier-vol6-v1
publisher: Sellier European Law Publishers
jurisdiction: DCFR
language: en
# DCFR Full Edition, тома 5–6 (книги VIII, IX, X). Отдельный профиль, а не
# правка dcfr-sellier-fulledition-v1: у этих томов другая вёрстка — кегль
# тела 9.5, заголовок статьи 11.0, а не 12.0 и 14.0.
#
# ИЗ ЭТОГО ФАЙЛА БЕРЁТСЯ ТОЛЬКО КНИГА X (полосы 1497–1571). Книги VIII и IX
# целиком есть в главном томе с теми же комментариями; резать оба файла
# значило бы задвоить статьи в корпусе. Книга X в главный том не вошла.
#
# Пробелы внутри номера гуляют по вёрстке: «X. –1:101», «X.– 3:101»,
# «X. – 2:102» — один и тот же адрес в трёх видах. Паттерн их допускает,
# а к единому виду адрес приводит scripts/normalize_article_address.py
# сразу после extract.py.

units:
  - type: "Art."
    id_prefix: "art"
    mode: flow
    pattern: '^[IVX]+\.\s*(?:[A-Z]\.\s*)?[–—-]\s*\d+\s*:\s*(\d+):\s'
    address_template: "{section}:{number}"

address:
  section:
    mode: pattern
    pattern: '^([IVX]+\.\s*(?:[A-Z]\.\s*)?[–—-]\s*\d+)\s*:\s*\d+:\s'
    anchor: start
  template: "{section}:{number}"

footnotes:
  # Аппарат вынесен в блоки COMMENTS и NOTES внутри статьи и набран тем же
  # кеглем, что тело. По кеглю его не отделить, и он остаётся в карточке —
  # дальше статья дробится по печатным заголовкам этих блоков.
  mode: none

printed_page:
  band: [0.05, 0.10]
  patterns:
    - '^(\d{1,4})$'

junk:
  # Колонтитул несёт тот же номер статьи («X. –1:101 Book X . Chapter 1»),
  # но без двоеточия после номера — под шаблон единицы он не подходит.
  # Снимается всё равно: иначе он ляжет первой строкой в текст карточки.
  # Колонтитулов ДВА и они чередуются по развороту: на обороте
  # «X. –1:102 Book X . Chapter 1…», на лицевой «Section 1: … X. – 1:102».
  # Второй сидит чуть ниже первого, поэтому полоса взята с запасом.
  header_band: 0.07
  patterns:
    # Лицевой колонтитул на всякий случай ловится и по виду: начинается
    # с «Section N:», а кончается номером статьи. Строки тела так не
    # выглядят — там за «Section N:» идёт заголовок, а не адрес.
    - '^Section\s+\d+.*\d{1,2}\s*:\s*\d{3}\s*$'
    # Оборотный колонтитул: «X. –1:102 Book X . Chapter 1: …». Полосой по
    # высоте он ловится не везде — на полосах с врезкой съезжает вниз.
    - '^[IVX]+\.\s*(?:[A-Z]\.\s*)?[–—-]\s*\d+\s*:\s*\d+\s+Book\s+[IVX]+'
    # Технологические строки вёрстки кеглем 3.5 — не текст книги.
    - 'fidus Publikations-Service'
    - '\{Sellier\}DCFR/'

statutory:
  patterns:
    - '\b[IVX]+\.\s*(?:[A-Z]\.\s*)?[–—-]\s*\d+\s*:\s*\d+\b'

citation:
  template: "{authors}, {title}, {publisher}, {year}, {address}"
