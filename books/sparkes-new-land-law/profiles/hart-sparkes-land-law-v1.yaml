id: hart-sparkes-land-law-v1
publisher: Hart Publishing
jurisdiction: EN
language: en
# Peter Sparkes, A New Land Law, 2nd ed. Издательский PDF, 983 страницы.
# Кегль тела 10.0, сносок 8.0, заголовка раздела 16.0.
#
# Единица цитирования — номер абзаца В КВАДРАТНЫХ СКОБКАХ в начале абзаца:
# «[1.03] That is far from representing the completion…». Так книга и
# цитируется: [1.03].
#
# Порог кегля отсекает таблицы в препринте, где те же номера перечислены
# подряд кеглем 8: «[14.05] [14.06] [14.07] [14.08]».

units:
  - type: "para."
    id_prefix: "para"
    mode: flow
    pattern: '^\[\d{1,2}\.(\d{2})\]'
    size_min: 9.5
    address_template: "[{section}.{number}]"

address:
  template: "[{section}.{number}]"
  section:
    mode: pattern
    pattern: '^\[(\d{1,2})\.\d{2}\]'

footnotes:
  mode: font_bottom
  note_size_max: 8.5
  bottom_band: 0.3

printed_page:
  band: 0.07
  patterns:
    - '\s(\d{1,4})$'
    - '^(\d{1,4})\s'

junk:
  header_band: 0.065

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\[\d{1,2}\.\d{2}\]'

citation:
  template: "{cite_as} {address}"
