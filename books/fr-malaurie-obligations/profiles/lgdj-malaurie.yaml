id: lgdj-malaurie
publisher: LGDJ / Lextenso
jurisdiction: FR
language: fr
# Собран по Malaurie, Aynès, Stoffel-Munck, Droit des obligations (LGDJ, Droit civil).
# Вёрстка бумажная: тело 10.0, «petits caractères» 8.5, сноски 8.0 внизу полосы,
# знаки сносок — надстрочные 4.7/5.6. Кегль сноски и кегль мелкого шрифта
# различаются всего на 0.5 pt, поэтому note_size_max держим на 8.2 и обязательно
# сверяем непрерывность номеров сносок в QA.

units:
  - type: "n°"
    id_prefix: "n"
    mode: flow
    # «134. Groupements et mentalité communautaire. – 1º) ...»
    # Точка после номера обязательна: без неё паттерн ловит номера статей.
    #
    # Справа от номера НЕ ВСЕГДА ЗАГЛАВНАЯ. Каждый шестой пункт у Малори
    # начинается с цифровой рубрики — «130. 1º) Garde alternative...», — и
    # требование заглавной выбрасывало их вместе с текстом: 249 номеров из
    # 947, то есть каждый четвёртый пункт книги.
    #
    # Номер трёхзначный НАМЕРЕННО. Четвёртая цифра ловит годы в начале
    # строки («2016. Cependant...») и заводит карточку с адресом n° 2016;
    # у Малори последний пункт — 947, и четвёртая цифра не нужна.
    # Цифровая рубрика справа пишется в файле по-разному: «1º)», «1 )» —
    # надстрочный знак градуса теряется при разборе, — «1º» без скобки,
    # «3» голой цифрой. Перечислять эти виды бессмысленно, поэтому справа
    # разрешена любая цифра.
    pattern: '^(\d{1,3})\.\s+(?=[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ«“]|\d)'

printed_page:
  # Колонцифра сидит В КОЛОНТИТУЛЕ: на чётной полосе слева от названия книги
  # («302 DROIT DES OBLIGATIONS»), на нечётной справа от названия раздела
  # («VICES DU CONSENTEMENT 301»). Полоса поиска только верхняя (0.06):
  # с симметричной полосой 0.12 снизу приезжают номера сносок, и книга
  # получает колонцифру 4 на 814-й полосе файла.
  band: [0.06, 0.0]
  patterns:
    - '^(\d{1,4})\s+[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ]'
    - '\s(\d{1,4})$'

address:
  section:
    mode: none
  template: "{unit_type} {number}"

footnotes:
  mode: font_bottom
  body_size: 10.0
  note_size_max: 8.2
  # Полоса низкая НАМЕРЕННО. Ветка A судит каждую строку отдельно: сноской
  # считается строка мельче note_size_max И ниже bottom_band. У Малори блок
  # сносок занимает иногда половину полосы и начинается на трети высоты; с
  # полосой 0.45 верхние сноски оставались в теле, паттерн читал их номер
  # как номер пункта, и книга получала 34 карточки с адресами вроде n° 37
  # посреди четвёртой сотни.
  # Кегли здесь разводятся чисто: 8.0 — сноски (13383 строки), 8.5 — «petits
  # caractères» тела (11272), 10.0 — тело. Поэтому решает кегль, а полоса
  # 0.10 нужна только чтобы не съесть колонтитул: он тоже набран восьмёркой.
  bottom_band: 0.10

junk:
  patterns:
    - 'Exemplaire personnel de .*Diffusion'
    - '^[eors]{1,3}(?:\s+[eors]{1,3})*$'

statutory:
  patterns:
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*(?:\s*(?:et|à|,)\s*\d+(?:-\d+)*)*\s*(?:C\.\s*civ\.|du Code civil)'
    - 'art(?:icle)?s?\.?\s*\d+(?:-\d+)*\s*C\.\s*(?:com|consom|pén|rur|proc\.\s*civ)\.'
    - 'L\.\s*\d{3}-\d+'

cross_refs:
  patterns:
    - '(?:supra|infra)\s*,?\s*n[o°s]*\s*\d+(?:\s*(?:et|à|,)\s*\d+)*'

citation:
  template: "{authors}, {title}, {edition}, {publisher}, {year}, {address}"
