id: pearson-duddington-land-law-v1
publisher: Pearson Education
jurisdiction: UK
language: en
# John Duddington, Law Express: Land Law, 3rd ed. Издательский PDF,
# 239 страниц, тело f24–f226 (печатные 1–203, смещение 23).
#
# Пособие для подготовки к экзамену. Кегли: тело 10.0, заголовок раздела
# 18.0 с маркером «■■», подзаголовок 16.0 без маркера, врезки
# («KEY CASE», «Exam TIP») 9.0, колонцифра 8.0 внизу слева/справа.
#
# СВОЕЙ ЕДИНИЦЫ ЦИТИРОВАНИЯ У КНИГИ НЕТ: разделы не нумерованы вовсе.
# Единица — раздел по заголовку, адрес — типографская страница.
#
# Заголовок отличается от тела ТОЛЬКО кеглем: подзаголовок кеглем 16
# набран строчными и выглядит обычной фразой («interests which override on
# first registration»). Поэтому паттерн пустой, а работу делает порог
# кегля 15.5–18.5. Пустые строки кегля 17.8 — декоративные глифы, их
# отсекает требование непробельного знака.
#
# Сносок в книге нет.
#
# Во встроенном шрифте у части глифов перепутан регистр: в строках,
# набранных СПЛОШЬ ПРОПИСНЫМИ, часть букв выходит строчными — «lAnd lAw»,
# «kEy CaSE», «EWCa Civ 347», «ukHL 17». Тело книги набрано обычным
# регистром и не пострадало; колонтитулы снимаются как мусор. Сокращения
# судов и сборников в ссылках на дела чинит
# scripts/upcase_abbreviations.py.

units:
  - type: "p."
    id_prefix: "sec"
    mode: heading
    pattern: '^\S.{0,90}$'
    size_min: 15.5
    size_max: 18.5
    address_template: "p. {page}"

address:
  template: "p. {page}"

footnotes:
  mode: none

printed_page:
  band: 0.08

junk:
  header_band: 0.095
  footer_band: 0.92
  patterns:
    - '^[A-Z]\d{2}_[A-Z]{4}\d'

statutory:
  patterns:
    - '\b[A-Z][A-Za-z’\'' ]{3,40}Act\s+\d{4}(?:\s+ss?\.?\s*\d+[A-Za-z]*)?'
    - '\bss?\s?\d+[A-Za-z]*(?:\(\d+\))?'

cross_refs:
  patterns:
    - '\bChapter\s?\d{1,2}\b'

citation:
  template: "{cite_as} {address}"
