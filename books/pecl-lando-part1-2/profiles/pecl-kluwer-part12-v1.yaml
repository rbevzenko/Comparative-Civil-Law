id: pecl-kluwer-part12-v1
publisher: Kluwer Law International
jurisdiction: DCFR
language: en
# Principles of European Contract Law, Parts I and II (ред. Lando, Beale),
# Kluwer, 2000. Файл распознан владельцем: скан с текстовым слоем поверх
# растра. Профиль отдельный от третьей части: там колонтитул стоит на 0.072
# высоты, здесь на 0.077, и общая полоса резала бы либо колонтитул не до
# конца, либо заголовок статьи.
#
# ЕДИНИЦА — СТАТЬЯ: «Article 10:205». Так PECL и цитируют.
#
# КЕГЛЬ ЗДЕСЬ НЕНАДЁЖЕН. Это распознанный скан: буквенный подзаголовок
# комментария («G. Relation to National Law») набран тем же кеглем, что и
# тело. Поэтому колонтитул отделяется от заголовка статьи ПОЛОЖЕНИЕМ, а не
# кеглем: колонтитул сидит на 0.077 высоты (низ 0.091), тело начинается
# с 0.114.
#
# Колонтитул несёт колонцифру: «Article 10:205: Regime of Solidary Claims 83»
# на лицевой, «82 Chapter 10» на оборотной.
#
# ДИАПАЗОН ПОЛОС: тело комментария 145–508. С 52 по 144 книга печатает текст
# статей отдельно, без разбора (печатные полосы 3–95), и с 145 начинается
# комментарий с печатной полосы 96. Взять обе части значило бы задвоить
# каждую статью. После 508 идут таблицы дел и норм.
#
# В номере статьи распознавание иногда вставляет пробел после двоеточия
# («Article 7: 111», «Article 9 :40 1») — поэтому в шаблоне он допущен.
# Первое двоеточие без пробела: искажается обычно второе.

units:
  - type: "Art."
    id_prefix: "art"
    mode: flow
    pattern: '^Article\s*\d+:\s?(\d+):\s+(?=[A-Z])'
    address_template: "Article {section}:{number}"

address:
  section:
    mode: pattern
    pattern: '^Article\s*(\d+):\s?\d+:\s+(?=[A-Z])'
    anchor: start
  template: "Article {section}:{number}"

footnotes:
  # Аппарат — блоки COMMENT и NOTES внутри статьи, а не подвал полосы.
  mode: none

printed_page:
  band: [0.10, 0.0]
  patterns:
    - '^(\d{1,4})\s+\D'
    - '\D\s+(\d{1,4})$'

junk:
  # Низ колонтитула на 0.087, заголовок статьи начинается с 0.111.
  header_band: 0.10
  patterns: []

statutory:
  patterns:
    - '\bArt(?:icle)?s?\.?\s?\d+:\d+\b'
    - '\bCC\s+arts?\.\s?\d+\b'

citation:
  template: "{authors}, {title}, {publisher}, {year}, {address}"
