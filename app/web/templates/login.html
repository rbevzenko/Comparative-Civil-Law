<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Корпус сравнительного права</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form method="post" action="/ui/login" class="login-card">
      <div class="brand__mark brand__mark--lg">CCL</div>
      <h1>Корпус сравнительного частного права</h1>
      <p class="login-sub">Внутренний инструмент. Введите пароль доступа.</p>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit" class="btn btn--primary btn--block">Войти</button>
    </form>
  </main>
</body>
</html>
