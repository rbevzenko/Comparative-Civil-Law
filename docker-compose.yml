services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corpus}
      POSTGRES_USER: ${POSTGRES_USER:-corpus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Conservative settings for a 4 GB host shared with the api container.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=60
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpus} -d ${POSTGRES_DB:-corpus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1536m

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      # Единственный порт наружу из compose. TLS-терминацию и проксирование
      # на него делает системный nginx хоста: он держит и 443, и 80. Свой
      # прокси (был caddy) убран — двум сервисам 443 не поделить, и держит
      # его nginx. Сам порт 8000 закрыт файрволом, снаружи не отвечает.
      - "8000:8000"
    mem_limit: 1024m

volumes:
  db_data:
