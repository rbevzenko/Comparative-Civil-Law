services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corpus}
      POSTGRES_USER: ${POSTGRES_USER:-corpus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Conservative settings for a 4 GB host shared with the api container.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=60
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpus} -d ${POSTGRES_DB:-corpus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1536m

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    mem_limit: 1024m

  # Reverse proxy in front of api: gets a real Let's Encrypt certificate for
  # MCP_DOMAIN automatically. Required because Claude.ai custom connectors
  # must be reachable over HTTPS with a valid cert — a bare IP on plain HTTP
  # (the api service above, kept for backward-compatible direct access)
  # doesn't qualify.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?MCP_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  db_data:
  caddy_data:
  caddy_config:
